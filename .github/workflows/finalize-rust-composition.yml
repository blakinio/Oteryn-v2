pub struct LoopbackCallbackListener {
    listener: TcpListener,
}

impl LoopbackCallbackListener {
    pub async fn bind() -> Result<Self, IdentityError> {
        let listener = TcpListener::bind(("127.0.0.1", 0))
            .await
            .map_err(|_error| IdentityError::LoopbackBind)?;
        Ok(Self { listener })
    }

    pub fn local_port(&self) -> Result<u16, IdentityError> {
        self.listener
            .local_addr()
            .map(|address| address.port())
            .map_err(|_error| IdentityError::LoopbackIo)
    }

    pub async fn await_callback(
        &self,
        flow: &IdentityFlow,
        cancellation: CancellationToken,
    ) -> Result<AuthorizationCode, IdentityError> {
        let accept = async {
            self.listener
                .accept()
                .await
                .map_err(|_error| IdentityError::LoopbackIo)
        };
        let bounded = tokio::time::timeout(flow.timeout, cancellable(cancellation, accept))
            .await
            .map_err(|_elapsed| IdentityError::Timeout)?;
        let (mut stream, peer) = match bounded {
            Cancellable::Completed(result) => result?,
            Cancellable::Cancelled => return Err(IdentityError::Cancelled),
        };
        if !peer.ip().is_loopback() {
            return Err(IdentityError::InvalidCallback);
        }
        let result = read_callback_query(&mut stream)
            .await
            .and_then(|query| flow.validate_query(&query));
        match result {
            Ok(code) => {
                write_callback_response(
                    &mut stream,
                    "200 OK",
                    "Authorization complete. Return to Oteryn.",
                )
                .await?;
                Ok(code)
            }
            Err(error) => {
                let _response = write_callback_response(
                    &mut stream,
                    "400 Bad Request",
                    "Authorization callback rejected.",
                )
                .await;
                Err(error)
            }
        }
    }
}

async fn read_callback_query(stream: &mut TcpStream) -> Result<String, IdentityError> {
    let mut request = Vec::with_capacity(1024);
    let mut chunk = [0_u8; 1024];
    loop {
        if request.len() >= MAX_CALLBACK_REQUEST_BYTES {
            return Err(IdentityError::CallbackRequestTooLarge);
        }
        let read = stream
            .read(&mut chunk)
            .await
            .map_err(|_error| IdentityError::LoopbackIo)?;
        if read == 0 {
            break;
        }
        let next_len = request
            .len()
            .checked_add(read)
            .ok_or(IdentityError::CallbackRequestTooLarge)?;
        if next_len > MAX_CALLBACK_REQUEST_BYTES {
            return Err(IdentityError::CallbackRequestTooLarge);
        }
        request.extend_from_slice(&chunk[..read]);
        if request.windows(4).any(|window| window == b"\r\n\r\n") {
            break;
        }
    }
    let request = std::str::from_utf8(&request).map_err(|_error| IdentityError::InvalidCallback)?;
    let request_line = request.lines().next().ok_or(IdentityError::InvalidCallback)?;
    let mut parts = request_line.split_whitespace();
    if parts.next() != Some("GET") {
        return Err(IdentityError::InvalidCallback);
    }
    let target = parts.next().ok_or(IdentityError::InvalidCallback)?;
    if !matches!(parts.next(), Some("HTTP/1.0" | "HTTP/1.1")) || parts.next().is_some() {
        return Err(IdentityError::InvalidCallback);
    }
    let (path, query) = target
        .split_once('?')
        .ok_or(IdentityError::InvalidCallback)?;
    if path != "/callback" || query.is_empty() {
        return Err(IdentityError::InvalidCallback);
    }
    Ok(query.to_owned())
}

async fn write_callback_response(
    stream: &mut TcpStream,
    status: &str,
    body: &str,
) -> Result<(), IdentityError> {
    let response = format!(
        "HTTP/1.1 {status}\r\nContent-Type: text/plain; charset=utf-8\r\nContent-Length: {}\r\nCache-Control: no-store\r\nConnection: close\r\n\r\n{body}",
        body.len()
    );
    stream
        .write_all(response.as_bytes())
        .await
        .map_err(|_error| IdentityError::LoopbackIo)
}

