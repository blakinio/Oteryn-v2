name: Temporary ADR-0009 gate-order repair

on:
  push:
    branches:
      - docs/sync-adr-0009-registers

permissions:
  contents: write

jobs:
  repair-docs-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sync-adr-0009-registers
          fetch-depth: 0

      - name: Repair gate ordering and classification
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "docs/architecture/FOUNDATION_DECISION_BACKLOG.md",
              "20. Implement QA-E2E-01 incrementally as the client, protocol, admission, persistence and content prerequisites land\n21. Accept PERF-01 before publishing supported capacity or claiming representative-load readiness\n22. Accept OPS-CHANNEL-01 before automatic production channel scaling or production recovery behavior is claimed\n23. Accept VSL-01 Foundation Vertical-Slice Programme with correlated event/audit evidence and named QA-E2E-01 tiers\n24. Execute the separately authorized vertical-slice implementation programme\n25. Accept GAME-ABILITY-01, GAME-AI-01 and GAME-INTERACTION-01 before Playable Alpha gameplay breadth is claimed\n26. Accept PROD-LIVEOPS-01, PROD-COMPAT-01, SEC-CLIENT-01, DATA-PRIVACY-01, UX-I18N-A11Y-01 and OPS-GM-01 before Playable Alpha operational completeness is claimed\n27. Complete ANL-02/ANL-03 before production-grade alpha analytics claims; defer ANL-04 until read-only investigation is authorized\n28. Activate expansion/deferred gameplay-product gates only when their milestone or explicit owner decision requires them",
              "20. Implement QA-E2E-01 incrementally as the client, protocol, admission, persistence and content prerequisites land\n21. Accept VSL-01 Foundation Vertical-Slice Programme with correlated event/audit evidence and named QA-E2E-01 tiers\n22. Execute the separately authorized vertical-slice implementation programme\n23. Accept PERF-01 before publishing supported capacity or claiming Playable Alpha representative-load readiness\n24. Accept OPS-CHANNEL-01 before automatic production channel scaling or production GameNode/channel recovery behavior is claimed\n25. Accept GAME-ABILITY-01, GAME-AI-01 and GAME-INTERACTION-01 before Playable Alpha gameplay breadth is claimed\n26. Accept PROD-LIVEOPS-01, PROD-COMPAT-01, SEC-CLIENT-01, DATA-PRIVACY-01, UX-I18N-A11Y-01 and OPS-GM-01 before Playable Alpha operational completeness is claimed\n27. Complete ANL-02/ANL-03 before production-grade alpha analytics claims; defer ANL-04 until read-only investigation is authorized\n28. Activate expansion/deferred gameplay-product gates only when their milestone or explicit owner decision requires them",
          )

          replace_once(
              "docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md",
              "- Status: `REQUIRED_FOR_ALPHA` for automatic production scaling and claimed production recovery behavior.\n- Define process/container packaging",
              "- Status: `BLOCKS_LAYER_IMPLEMENTATION`.\n- Blocks automatic production channel scaling and claimed production GameNode/channel recovery behavior.\n- Define process/container packaging",
          )

      - name: Validate governance and links
        run: python tools/agents/validate_governance.py

      - name: Commit documentation only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/FOUNDATION_DECISION_BACKLOG.md docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md
          git commit -m "docs(architecture): correct ADR-0009 gate ordering"
          git push origin HEAD:docs/sync-adr-0009-registers
