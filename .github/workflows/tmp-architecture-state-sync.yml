name: Temporary architecture state synchronization

on:
  push:
    branches:
      - docs/sync-architecture-state-20260806

permissions:
  contents: write

concurrency:
  group: architecture-state-sync-20260806
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out synchronization branch
        uses: actions/checkout@v4
        with:
          ref: docs/sync-architecture-state-20260806
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize canonical documents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_regex(path: str, pattern: str, replacement: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit(f"{path}: regex expected exactly one match, found {count}: {pattern[:120]!r}")
              p.write_text(updated, encoding="utf-8")

          # ADR-0001: align NodeId with the later accepted ADR-0009 terminology.
          replace_once(
              "docs/architecture/ADR-0001-native-rust-multichannel-platform.md",
              "- `NodeId` — physical process or host;",
              "- `NodeId` — logical identity of one GameNode process runtime; it never identifies the physical host, container or orchestrator node;",
          )

          # Global decision register.
          global_path = "docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md"
          replace_once(global_path, "- Date: 2026-08-05", "- Date: 2026-08-06")
          replace_once(
              global_path,
              "| Reference and evolved world product profiles over one engine, client and `protocol-oteryn`, with isolated world-scoped gameplay value | `ACCEPTED` | ADR-0010 and `PRODUCT_DIRECTION_BASELINE.md` |",
              "| Reference and evolved world product profiles over one engine, client and `protocol-oteryn`, with isolated world-scoped gameplay value | `ACCEPTED` | ADR-0010 and `PRODUCT_DIRECTION_BASELINE.md` |\n| Fail-closed native client state before the accepted gameplay protocol exists | `ACCEPTED` | ADR-0011 |\n| FND-01 workspace contract, VSL-02 migration contract and atomic 19-member destination cutover | `ACCEPTED` | `FND-01_WORKSPACE_AND_RUST_MIGRATION_CONTRACT.md`, `VSL-02_RUST_CLIENT_MIGRATION_AND_CUTOVER_CONTRACT.md` and merge `78988f72a80cc904aa9176ae850c50d4efa0b0f0` |",
          )
          replace_once(
              global_path,
              "- Before `FND-01`, do not create the canonical root Cargo workspace.\n- After `FND-01`, `VSL-02` is the next mandatory gate; it must pin and reconcile the exact client cutover before shared client/server contracts are frozen.\n- One atomic `blakinio/Oteryn-v2` destination PR must contain the accepted client migration, root-workspace creation/completion, dependency enforcement, ADR-0008 `protocol-canary` exclusion, provenance and exact-head validation; no separate destination bootstrap PR may follow.\n- A later `blakinio/otclient` PR is source-only cutover closeout and may merge only after the verified destination squash merge.\n- Do not create a competing placeholder client or claim a complete canonical workspace before the controlled migration/cutover.",
              "- `FND-01` and the `VSL-02` destination migration are complete. The canonical 19-member Rust workspace was squash-merged through PR #50 as `78988f72a80cc904aa9176ae850c50d4efa0b0f0`.\n- The migrated client is in the accepted ADR-0011 `pre-native-protocol` state: it launches and fails closed before gameplay credential consumption, routing or transport.\n- `protocol-canary` and a speculative production `protocol-oteryn` adapter are absent from the destination production graph.\n- The remaining cutover action is the source-only historical marker in `blakinio/otclient`; it must point to the exact destination merge and prevent the old path from becoming a second canonical product line.\n- `FND-ID-01` begins only after that source-marker closeout is merged and verified.",
          )
          replace_regex(
              global_path,
              r"(### `FND-01` — Workspace, Dependency and Existing-Rust Migration Contract\n\n)- Status: `BLOCKS_WORKSPACE_BOOTSTRAP`",
              r"\1- Status: `ACCEPTED`; contract archived and applied by the atomic destination cutover merged as `78988f72a80cc904aa9176ae850c50d4efa0b0f0`.",
          )
          replace_regex(
              global_path,
              r"(### `VSL-02` — Exact Rust Client Migration and Cutover Contract\n\n)- Status: `BLOCKS_WORKSPACE_BOOTSTRAP`",
              r"\1- Status: `ACCEPTED`; destination migration is complete, while the required source-only `blakinio/otclient` marker remains cross-repository closeout.",
          )
          replace_once(
              global_path,
              "- Status: `BLOCKS_LAYER_IMPLEMENTATION` for protocol and admission schemas.\n- Begin only after the accepted client migration/cutover and destination workspace bootstrap/completion.",
              "- Status: `BLOCKS_LAYER_IMPLEMENTATION` for protocol and admission schemas.\n- Ordered start condition: merge and verify the source-only `blakinio/otclient` historical marker for the completed destination cutover.\n- The destination workspace bootstrap/completion prerequisite is already satisfied by merge `78988f72a80cc904aa9176ae850c50d4efa0b0f0`.",
          )
          replace_once(
              global_path,
              "Draft and accept `FND-01` — the **Workspace, Dependency and Existing-Rust Migration Contract**. Its terminal next action is `VSL-02`, followed by one atomic destination migration/workspace PR, the source-only cutover marker and only then layer-specific contracts. The registered gameplay/product gates remain ordered future work and do not replace this immediate action.",
              "Complete and merge the source-only historical marker in `blakinio/otclient` for destination merge `78988f72a80cc904aa9176ae850c50d4efa0b0f0`. After that cross-repository closeout is verified, draft and accept `FND-ID-01` — the Foundation Identifier Vocabulary. No `protocol-oteryn`, runtime, admission or durable-gameplay contract may bypass that order.",
          )

          # Foundation backlog.
          backlog = "docs/architecture/FOUNDATION_DECISION_BACKLOG.md"
          replace_once(backlog, "- Date: 2026-08-05", "- Date: 2026-08-06")
          replace_once(
              backlog,
              "Canonical decisions: ADR-0001 through ADR-0010.",
              "12. **Canonical workspace and pre-native client cutover state**\n   - `FND-01` and the `VSL-02` destination contract are accepted and archived;\n   - PR #50 delivered the accepted 19-member canonical Rust workspace and was squash-merged as `78988f72a80cc904aa9176ae850c50d4efa0b0f0`;\n   - the client is in ADR-0011 `pre-native-protocol` and fails closed before gameplay credential consumption, routing or transport;\n   - the production graph contains neither `protocol-canary` nor a speculative production `protocol-oteryn` adapter;\n   - the remaining migration action is the source-only historical marker in `blakinio/otclient`; `FND-ID-01` follows after that closeout.\n\nCanonical decisions: ADR-0001 through ADR-0011.",
          )
          replace_regex(
              backlog,
              r"### Gate 0 — before `FND-01`\n\n.*?### Gate 2 — after the atomic `VSL-02` destination merge and source-marker cutover",
              "### Completed foundation migration sequence\n\n- `FND-01` was accepted and archived with the exact source inventory, migration dispositions, toolchain, target matrix and machine-enforced workspace boundaries.\n- `VSL-02` was accepted and archived with the exact cutover SHA, source reconciliation, provenance, path mapping and rollback contract.\n- The atomic destination migration/workspace PR #50 was squash-merged as `78988f72a80cc904aa9176ae850c50d4efa0b0f0`.\n- ADR-0011 defines the resulting fail-closed `pre-native-protocol` state.\n\n### Current cross-repository closeout\n\nThe destination workspace is canonical and verified. The remaining migration action is a source-only `blakinio/otclient` marker that preserves history, points to the exact destination merge and prevents continued canonical development in the old path. No Oteryn-v2 implementation belongs in that source-marker PR.\n\n`FND-ID-01` begins only after this source-marker closeout is merged and verified.\n\n### Gate 2 — after the atomic `VSL-02` destination merge and source-marker cutover",
          )
          replace_once(
              backlog,
              "### `FND-01` — Workspace, Dependency and Existing-Rust Migration Contract\n\nThis contract blocks creation",
              "### `FND-01` — Workspace, Dependency and Existing-Rust Migration Contract\n\nStatus: **ACCEPTED AND APPLIED**. The retained detail below is the historical contract baseline implemented by the atomic destination cutover.\n\nThis contract blocks creation",
          )
          replace_once(
              backlog,
              "### `VSL-02` — Exact Rust Client Migration and Cutover Contract\n\nAccept immediately",
              "### `VSL-02` — Exact Rust Client Migration and Cutover Contract\n\nStatus: **ACCEPTED; DESTINATION COMPLETE; SOURCE-ONLY CLOSEOUT PENDING**.\n\nAccept immediately",
          )
          for old, new in [
              ("- [ ] `FND-01` Workspace, Dependency and Existing-Rust Migration Contract accepted.", "- [x] `FND-01` Workspace, Dependency and Existing-Rust Migration Contract accepted."),
              ("- [ ] FND-01 classifies every existing Rust client crate/subsystem and preserves its exact evidence or explicitly rejects it.", "- [x] FND-01 classifies every existing Rust client crate/subsystem and preserves its exact evidence or explicitly rejects it."),
              ("- [ ] `VSL-02` pins the exact cutover source SHA, provenance, open-PR/task disposition, path mapping, source freeze, destination ownership, history preservation and rollback.", "- [x] `VSL-02` pins the exact cutover source SHA, provenance, open-PR/task disposition, path mapping, source freeze, destination ownership, history preservation and rollback."),
              ("- [ ] The coordinated migration/cutover completes before canonical identifier, protocol, runtime or admission contracts are frozen.", "- [x] The coordinated destination migration/cutover completed before canonical identifier, protocol, runtime or admission contracts were frozen; source-only closeout remains pending."),
              ("- [ ] One atomic Oteryn-v2 destination PR creates/completes the root workspace around the migrated client; no second destination bootstrap/consolidation PR exists.", "- [x] One atomic Oteryn-v2 destination PR created/completed the root workspace around the migrated client; no second destination bootstrap/consolidation PR exists."),
              ("- [ ] Provenance records exact source SHA/range and path mapping without a false Git-ancestry claim.", "- [x] Provenance records exact source SHA/range and path mapping without a false Git-ancestry claim."),
              ("- [ ] Initial workspace members require an immediate consumer and observable acceptance; no empty layering crates.", "- [x] Initial workspace members require an immediate consumer and observable acceptance; no empty layering crates."),
              ("- [ ] Dependency directions become machine-enforced after the destination workspace exists.", "- [x] Dependency directions are machine-enforced in the destination workspace."),
          ]:
              replace_once(backlog, old, new)
          replace_once(
              backlog,
              "1. Accept FND-01 Workspace, Dependency and Existing-Rust Migration Contract\n2. Accept VSL-02 Exact Rust Client Migration and Cutover Contract\n3. Freeze and reconcile the exact source SHA, open PRs, tasks and post-inventory changes\n4. Deliver one atomic Oteryn-v2 destination PR containing client migration, root-workspace creation/completion, dependency enforcement, protocol-canary isolation, provenance and validation\n5. Squash-merge and verify the exact destination result\n6. Merge the source-only otclient moved/non-canonical marker PR\n7. Accept FND-ID-01 Foundation Identifier Vocabulary, including event/operation/transaction identities",
              "1. COMPLETED — Accept FND-01 Workspace, Dependency and Existing-Rust Migration Contract\n2. COMPLETED — Accept VSL-02 Exact Rust Client Migration and Cutover Contract\n3. COMPLETED — Freeze and reconcile the exact source SHA, open PRs, tasks and post-inventory changes\n4. COMPLETED — Deliver one atomic Oteryn-v2 destination PR containing client migration, root-workspace creation/completion, dependency enforcement, protocol-canary isolation, provenance and validation\n5. COMPLETED — Squash-merge and verify the exact destination result as `78988f72a80cc904aa9176ae850c50d4efa0b0f0`\n6. NEXT — Merge the source-only otclient moved/non-canonical marker PR\n7. THEN — Accept FND-ID-01 Foundation Identifier Vocabulary, including event/operation/transaction identities",
          )
          replace_once(
              backlog,
              "- `FND-01` must be accepted before the destination client/workspace shape is frozen.\n- `VSL-02` must immediately follow `FND-01` and must pin source SHA, provenance, open-PR disposition, source freeze, cutover, history preservation, destination bootstrap sequencing and rollback before moving client code.\n- The canonical destination workspace must be created or completed inside the one atomic Oteryn-v2 migration PR; no import-only destination PR, later workspace-consolidation destination PR or competing placeholder client is allowed.\n- The separate otclient source-marker PR may merge only after the destination squash merge is immutable and verified; it carries no destination implementation.\n- Squash-merge provenance must retain exact source SHA/range and machine-readable path mapping without claiming imported Git ancestry.",
              "- `FND-01`, `VSL-02` and the one atomic destination migration/workspace PR are complete and verified.\n- The canonical destination workspace is merge `78988f72a80cc904aa9176ae850c50d4efa0b0f0`; no import-only or later consolidation destination PR is permitted.\n- The remaining migration gate is the separate `blakinio/otclient` source-marker PR. It carries no destination implementation and must point to the immutable destination merge.\n- Squash-merge provenance retains the exact source SHA/range and machine-readable path mapping without claiming imported Git ancestry.\n- `FND-ID-01` is the next architecture gate after the source marker is merged and verified.",
          )
          replace_once(
              backlog,
              "Execute `docs/agents/prompts/OTV2_GLOBAL_ARCHITECTURE_DECISION_COORDINATOR.md` and draft, audit, accept, merge and archive `FND-01` — the **Workspace, Dependency and Existing-Rust Migration Contract**. Its terminal next action must be `VSL-02`, not an isolated workspace bootstrap.",
              "Complete and merge the source-only historical marker in `blakinio/otclient` for destination merge `78988f72a80cc904aa9176ae850c50d4efa0b0f0`. After that closeout is verified, draft, audit, accept, merge and archive `FND-ID-01` — the Foundation Identifier Vocabulary.",
          )

          # Architecture gap register.
          gap = "docs/architecture/ARCHITECTURE_ANALYSIS_GAP_REGISTER.md"
          replace_once(gap, "- Date: 2026-08-05", "- Date: 2026-08-06")
          replace_once(
              gap,
              "The immediate programme action remains `FND-01` — Workspace, Dependency and Existing-Rust Migration Contract. Product and creative analysis may proceed in parallel when it does not redefine accepted foundation boundaries or delay the atomic client migration sequence.",
              "The immediate programme action is the source-only historical marker in `blakinio/otclient` for the completed destination cutover. After that closeout, `FND-ID-01` is the next architecture gate. Product and creative analysis may proceed in parallel when it does not redefine accepted foundation boundaries or delay that ordered foundation sequence.",
          )
          replace_once(
              gap,
              "- Global Tibia parity as the initial product reference plus optional reference/evolved world profiles over one engine, client and `protocol-oteryn`, with default world-scoped gameplay-value isolation (ADR-0010).",
              "- Global Tibia parity as the initial product reference plus optional reference/evolved world profiles over one engine, client and `protocol-oteryn`, with default world-scoped gameplay-value isolation (ADR-0010).\n- the accepted 19-member canonical Rust workspace, ADR-0011 `pre-native-protocol` client state and completed atomic destination cutover merged as `78988f72a80cc904aa9176ae850c50d4efa0b0f0`.",
          )
          replace_once(gap, "- Priority: parallel analysis with `FND-01`; must be accepted before broad gameplay and content production", "- Priority: parallel analysis with `FND-ID-01`; must be accepted before broad gameplay and content production")
          replace_once(gap, "# B. Foundation contracts not yet accepted", "# B. Foundation state and unresolved contracts")
          replace_regex(
              gap,
              r"## 3\. Workspace, migration and dependency structure\n\n.*?## 4\. Identifier, protocol, runtime and admission contracts",
              "## 3. Workspace, migration and dependency structure\n\n- Coverage status: **ACCEPTED / CROSS_REPOSITORY_CLOSEOUT_PENDING**\n- Completed gates: `FND-01`, `VSL-02` and the atomic destination cutover\n- Canonical destination merge: `78988f72a80cc904aa9176ae850c50d4efa0b0f0`\n- Remaining action: source-only historical marker in `blakinio/otclient`\n\nAccepted evidence:\n\n- every existing Rust client subsystem was inventoried and assigned an explicit migration disposition;\n- the accepted 19-member workspace has immediate consumers, pinned toolchain/lockfile policy and machine-enforced dependency boundaries;\n- provenance, exact source SHA, path mapping, transformation evidence and rollback are retained;\n- `protocol-canary` is absent from the production workspace graph and release path;\n- the migrated client is explicitly `pre-native-protocol` and fails closed before gameplay credential consumption, routing or transport.\n\nStill unresolved only as cross-repository closeout:\n\n- merge a source-only `blakinio/otclient` marker pointing to the exact destination merge and preventing the old path from becoming a second canonical product line.\n\n## 4. Identifier, protocol, runtime and admission contracts",
          )
          replace_once(
              gap,
              "1. `FND-01` — workspace, dependency and existing-client migration contract.\n2. `GAME-VISION-01` — refine ADR-0010 into measurable parity scope, product pillars and launch strategy, in parallel without blocking workspace analysis.",
              "1. Complete the source-only `blakinio/otclient` marker for the merged destination cutover.\n2. `FND-ID-01` — foundation identifier vocabulary.\n3. `GAME-VISION-01` — refine ADR-0010 into measurable parity scope, product pillars and launch strategy in parallel without blocking identifier analysis.",
          )
          replace_once(
              gap,
              "5. keep `FND-01` as the immediate next action until its own accepted contract explicitly advances the programme.",
              "5. derive the immediate next action from merged task/ADR evidence and update this register whenever a completed gate advances the programme.",
          )

          # Non-owning foundation programme checkpoint.
          programme = "docs/agents/tasks/active/OTV2-20260805-foundation-preimplementation-contracts.md"
          replace_once(programme, "base_sha: bd87792c92e26835d44c633a6064808f487a58a2", "base_sha: 1b91f9aa0abda8fccb0389972636708c4301ef88")
          replace_once(programme, "updated_at: 2026-08-05T15:06:00+02:00", "updated_at: 2026-08-06T13:30:00+02:00")
          replace_once(programme, "  - ADR-0001 through ADR-0006 accepted foundation", "  - ADR-0001 through ADR-0011 accepted foundation\n  - FND-01 and VSL-02 accepted and archived\n  - atomic destination cutover merged as 78988f72a80cc904aa9176ae850c50d4efa0b0f0")
          replace_once(
              programme,
              "  - canonical root Cargo workspace bootstrap or completion until FND-01 and the VSL-02 migration/cutover sequence are accepted\n  - protocol and Game Session identifier meanings until the client is migrated and FND-ID-01 is accepted",
              "  - FND-ID-01 start until the required source-only blakinio/otclient historical marker is merged and verified\n  - protocol and Game Session identifier meanings until FND-ID-01 is accepted",
          )
          replace_regex(
              programme,
              r"### PROVEN\n\n.*?Every replacement agent must verify this baseline against the live default branch before repeating it\.",
              "### PROVEN\n\n- `main` at this checkpoint is `1b91f9aa0abda8fccb0389972636708c4301ef88`.\n- `FND-01` and `VSL-02` are accepted and archived.\n- PR #50 delivered the accepted 19-member canonical Rust workspace and was squash-merged as `78988f72a80cc904aa9176ae850c50d4efa0b0f0`; PR #53 archived the destination cutover task.\n- The native Rust client is now canonical in `blakinio/Oteryn-v2` and is in ADR-0011 `pre-native-protocol`.\n- The destination production graph contains neither `protocol-canary` nor a speculative production `protocol-oteryn` adapter.\n- No complete `protocol-oteryn` Rust client-to-server gameplay implementation or native gameplay E2E is proven.\n- Oteryn Platform contains Identity, World Registry, Game Login Ticket and a standalone Go Game Gateway.\n- No merged source-only historical marker in `blakinio/otclient` is proven by this checkpoint.\n\nEvery replacement agent must verify this baseline against the live default branch before repeating it.",
          )
          replace_regex(
              programme,
              r"2\. \*\*Repository ownership and client cutover order\*\*\n.*?\n\n3\. \*\*Platform boundary\*\*",
              "2. **Repository ownership and client cutover state**\n   - the Rust client is canonical in `blakinio/Oteryn-v2`;\n   - client and shared Rust crates use the accepted 19-member canonical workspace;\n   - `protocol-canary` is absent from the destination production graph;\n   - `FND-01` and `VSL-02` are accepted and archived;\n   - the atomic destination migration/workspace PR was merged as `78988f72a80cc904aa9176ae850c50d4efa0b0f0`;\n   - the client is in ADR-0011 `pre-native-protocol` and fails closed before gameplay credential consumption, routing or transport;\n   - the remaining cutover action is the source-only `blakinio/otclient` historical marker;\n   - `FND-ID-01` follows after that marker is merged and verified.\n\n3. **Platform boundary**",
          )
          replace_once(
              programme,
              "Canonical evidence: ADR-0001 through ADR-0006.",
              "7. **Canonical workspace and pre-native client state**\n   - the destination workspace, dependency policy, provenance and migration evidence are accepted and implemented;\n   - ADR-0011 explicitly names the fail-closed state before `protocol-oteryn` exists;\n   - destination completion does not prove protocol, server runtime, admission, durable gameplay or native gameplay E2E.\n\nCanonical evidence: ADR-0001 through ADR-0011, `FND-01_WORKSPACE_AND_RUST_MIGRATION_CONTRACT.md`, `VSL-02_RUST_CLIENT_MIGRATION_AND_CUTOVER_CONTRACT.md` and destination merge `78988f72a80cc904aa9176ae850c50d4efa0b0f0`.",
          )
          replace_regex(
              programme,
              r"### Before `FND-01`\n\n.*?### Layer gates",
              "### Completed migration gates\n\n`FND-01`, `VSL-02` and the atomic destination migration/workspace PR are complete. The canonical destination merge is `78988f72a80cc904aa9176ae850c50d4efa0b0f0`. ADR-0011 defines the accepted `pre-native-protocol` state.\n\n### Current cross-repository closeout\n\nThe next required action is a source-only `blakinio/otclient` historical marker. It must preserve the old repository as evidence, point to the exact destination merge, redirect new Oteryn v2 client work to `blakinio/Oteryn-v2` and contain no destination implementation.\n\n`FND-ID-01` begins after that closeout is merged and verified.\n\n### Layer gates",
          )
          replace_once(programme, "## Remaining foundation contracts", "## Foundation contract state")
          replace_once(
