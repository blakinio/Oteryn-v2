              ("- [ ] FND-01 classifies every existing Rust client crate/subsystem and preserves its exact evidence or explicitly rejects it.", "- [x] FND-01 classifies every existing Rust client crate/subsystem and preserves its exact evidence or explicitly rejects it."),
