name: OTV2 foundation contract hardening

on:
  push:
    branches:
      - docs/foundation-contract-hardening-20260805
    paths:
      - .github/workflows/otv2-foundation-contract-hardening.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/foundation-contract-hardening-20260805
          fetch-depth: 0

      - name: Recover and apply bounded architecture patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source = subprocess.check_output(
              [
                  'git',
                  'show',
                  'd99c771023f85353e99a6444bd47f35b4ad9ac90:.github/workflows/otv2-foundation-contract-hardening.yml',
              ],
              text=True,
          ).splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          script_lines = [
              line[10:] if line.startswith('          ') else line
              for line in source[start:end]
          ]
          script = '\n'.join(script_lines) + '\n'
          script = script.replace("replace_once(task, 'pr: null', 'pr: 15')\n", '')
          script = script.replace("workflow.unlink()\n", '')
          Path('/tmp/apply_foundation_hardening.py').write_text(
              script,
              encoding='utf-8',
              newline='\n',
          )
          PY
          python3 /tmp/apply_foundation_hardening.py
          python tools/agents/validate_governance.py
          python -m json.tool docs/contracts/CROSS_REPOSITORY_CONTRACT_LOCK.json >/dev/null
          python -m json.tool docs/contracts/RESOURCE_LIMITS_REGISTRY.json >/dev/null
          git diff --check

      - name: Persist validated document tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs(architecture): harden foundation contracts"
          git push origin HEAD:docs/foundation-contract-hardening-20260805
