name: Finalize Rust client identifiers

on:
  push:
    branches:
      - migrate/rust-client-cutover-c923ad8
    paths:
      - '.github/workflows/finalize-rust-identifiers.yml'

permissions:
  contents: write

concurrency:
  group: finalize-rust-narrowing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migrate/rust-client-cutover-c923ad8

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

      - name: Complete provisional client identifier renames
        shell: python
        run: |
          import re
          from pathlib import Path

          diagnostics = Path('crates/diagnostics/src/lib.rs')
          text = diagnostics.read_text(encoding='utf-8')
          text = text.replace(
              '    ClientSessionEpoch as SessionGeneration, ClientTaskGeneration as TaskGeneration, Moment,\n',
              '    ClientSessionEpoch, ClientTaskGeneration, Moment,\n',
          )
          text = re.sub(r'\bSessionGeneration\b', 'ClientSessionEpoch', text)
          text = re.sub(r'\bTaskGeneration\b', 'ClientTaskGeneration', text)
          text = text.replace('session_generation', 'client_session_epoch')
          text = text.replace('task_generation', 'client_task_generation')
          text = text.replace('with_session', 'with_client_session_epoch')
          text = text.replace('with_task', 'with_client_task_generation')
          text = text.replace(' session={generation}', ' client_session_epoch={generation}')
          text = text.replace(' task={generation}', ' client_task_generation={generation}')
          diagnostics.write_text(text, encoding='utf-8')

          support = Path('crates/test-support/src/lib.rs')
          text = support.read_text(encoding='utf-8')
          text = text.replace('with_session(', 'with_client_session_epoch(')
          text = text.replace('with_task(', 'with_client_task_generation(')
          text = text.replace('.session_generation()', '.client_session_epoch()')
          text = text.replace('.task_generation()', '.client_task_generation()')
          support.write_text(text, encoding='utf-8')

          pre_native = Path('tests/pre-native-client/src/lib.rs')
          text = pre_native.read_text(encoding='utf-8')
          text = text.replace('runtime.pre_native_status()', 'ClientRuntime::pre_native_status()')
          pre_native.write_text(text, encoding='utf-8')

      - name: Refresh lockfile and formatting
        run: |
          cargo +1.94.0 generate-lockfile
          cargo +1.94.0 fmt --all

      - name: Apply strict Clippy fixes
        run: cargo +1.94.0 clippy --fix --allow-dirty --allow-staged --locked --workspace --all-targets -- -D warnings

      - name: Reject provisional identifier leaks
        shell: python
        run: |
          import re
          from pathlib import Path

          forbidden = re.compile(
              r'\b(SessionGeneration|TaskGeneration|WorldId|CharacterId|ChannelId|'
              r'AccountSessionId|DirectoryRevision|GameplayChannelId|GameEntryCredential|CanaryCurrent)\b'
          )
          findings = []
          for root in ('apps', 'crates', 'tests', 'tools'):
              for path in Path(root).rglob('*.rs'):
                  match = forbidden.search(path.read_text(encoding='utf-8'))
                  if match:
                      findings.append(f'{path}: {match.group(0)}')
          if findings:
              raise SystemExit('forbidden identifier leaks: ' + ', '.join(findings))
          print('provisional identifier isolation: PASS')

      - name: Prove Linux workspace and harness
        run: |
          cargo +1.94.0 test --locked --workspace
          cargo +1.94.0 run --locked -p oteryn-synthetic-client-harness
          cargo +1.94.0 run --locked -p oteryn-architecture-check -- workspace .

      - name: Remove one-shot workflows and commit
        run: |
          git rm -f \
            .github/workflows/bootstrap-rust-lock.yml \
            .github/workflows/cleanup-rust-lock.yml \
            .github/workflows/finalize-rust-narrowing.yml \
            .github/workflows/finalize-rust-identifiers.yml \
            2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock apps crates tests tools workspace-boundaries.toml
          git commit -m "fix(rust): finalize client dependency and identifier boundaries"
          git push origin HEAD:migrate/rust-client-cutover-c923ad8
