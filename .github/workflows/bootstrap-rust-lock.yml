name: Bootstrap Rust lockfile

on:
  push:
    branches:
      - migrate/rust-client-cutover-c923ad8
    paths:
      - Cargo.toml
      - '**/Cargo.toml'
      - rust-toolchain.toml

permissions:
  contents: write

concurrency:
  group: bootstrap-rust-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migrate/rust-client-cutover-c923ad8

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Generate exact lockfile
        run: cargo +1.94.0 generate-lockfile

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- Cargo.lock && git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build(rust): generate atomic workspace lockfile"
          git push origin HEAD:migrate/rust-client-cutover-c923ad8
