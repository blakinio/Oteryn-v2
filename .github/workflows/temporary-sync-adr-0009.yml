name: Temporary ADR-0009 register synchronization

on:
  push:
    branches:
      - docs/sync-adr-0009-registers

permissions:
  contents: write

jobs:
  apply-and-remove:
    runs-on: ubuntu-latest
    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          ref: docs/sync-adr-0009-registers
          fetch-depth: 0

      - name: Synchronize canonical architecture indexes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          backlog = "docs/architecture/FOUNDATION_DECISION_BACKLOG.md"
          register = "docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md"
          matrix = "docs/architecture/MULTICHANNEL_SYSTEM_SCOPE_MATRIX.md"

          replace_once(
              backlog,
              "- `QA-E2E-01` — Native End-to-End Test Platform Contract.\n- `ANL-01` — Game Event and Audit Foundation Contract.",
              "- `QA-E2E-01` — Native End-to-End Test Platform Contract.\n- `PERF-01` — Capacity, Performance and Scalability Contract.\n- `OPS-CHANNEL-01` — GameNode Deployment and Dynamic Channel Orchestration Contract.\n- `ANL-01` — Game Event and Audit Foundation Contract.",
          )

          replace_once(
              backlog,
              "   - `QA-E2E-01` blocks completion of `VSL-01`, but does not block `FND-01`, `VSL-02` or architecture discovery.\n\nCanonical decisions: ADR-0001 through ADR-0007.",
              "   - `QA-E2E-01` blocks completion of `VSL-01`, but does not block `FND-01`, `VSL-02` or architecture discovery.\n\n9. **Legacy protocol migration disposition**\n   - `protocol-canary` is fixed as `REFERENCE_ONLY` migration evidence;\n   - it is excluded from the production workspace dependency graph, binaries, negotiation, fallback and translation paths;\n   - `protocol-oteryn` remains an independently designed native protocol.\n\n10. **GameNode execution, capacity, deployment and recovery direction**\n   - `GameNode` is the logical runtime identity of one game-server process identified by `NodeId`, distinct from the host, container and orchestrator node;\n   - production defaults to one GameNode process per container, while one GameNode may host several ChannelRuntimes when measured capacity and blast-radius policy allow it;\n   - the process is multithreaded, but each channel retains one logical authoritative writer and stale auxiliary results are rejected by identity, generation and revision;\n   - capacity is measured separately per channel, GameNode and logical world; no fixed player limits are accepted without representative benchmarks;\n   - the initial production headroom target is at least 30% below measured saturation until `PERF-01` provides superseding evidence;\n   - existing GameNodes may start channels within accepted capacity, while an external orchestrator starts, replaces and stops processes or containers;\n   - initial failure recovery uses fencing, checkpoint plus bounded replay, fresh Game Sessions and a full snapshot, without silently moving players to another channel.\n\nCanonical decisions: ADR-0001 through ADR-0009.",
          )

          replace_once(
              backlog,
              "- `FND-04` gates production admission, Game Session validation and character lease behavior.\n- `DUR-01` through `DUR-03` gate authoritative durable character, item and currency mutation.",
              "- `FND-04` gates production admission, Game Session validation and character lease behavior.\n- `PERF-01` gates published player-capacity claims and representative-load readiness.\n- `OPS-CHANNEL-01` gates automatic production channel scaling and claimed production GameNode/channel recovery behavior.\n- `DUR-01` through `DUR-03` gate authoritative durable character, item and currency mutation.",
          )

          replace_once(
              backlog,
              "audience\n```\n\n## Decisions required before durable gameplay mutation",
              "audience\n```\n\n## Capacity and channel operations follow-up contracts\n\nADR-0009 accepts the execution, capacity-measurement, deployment-boundary and recovery direction without inventing unsupported numerical limits or selecting an orchestrator product.\n\n### `PERF-01` — Capacity, Performance and Scalability Contract\n\nDecide and prove:\n\n- named reference hardware, operating system and process/container resource cells;\n- command, simulation, queue-age and resource service objectives;\n- representative idle, movement, hunting, crowded-interest-set, mass-combat, raid, reconnect-storm, persistence-pressure, multi-channel noisy-neighbor and recovery workloads;\n- separate channel, GameNode and logical-world capacity limits;\n- safety headroom, overload admission and graceful-degradation policy;\n- profiling, soak, memory-growth and performance-regression evidence;\n- CI, nightly and release placement for repeatable benchmark evidence.\n\nPlayer count alone is not a scaling signal. Accepted limits must also account for latency, queue age, CPU, memory, network, persistence health and the first violated service objective.\n\n### `OPS-CHANNEL-01` — GameNode Deployment and Dynamic Channel Orchestration Contract\n\nDecide:\n\n- exact process/container packaging and production control-plane topology;\n- GameNode registration, health, readiness, capacity and compatible-revision reporting;\n- channel lifecycle, placement, dynamic creation, hysteresis, draining and closure;\n- external orchestrator authority and least-privilege boundaries;\n- ownership generation, fencing, restart, replacement, checkpoint, bounded replay and reconnect sequencing;\n- reconnect grace, player-visible outcomes, RPO, RTO and disaster-test requirements;\n- blast-radius limits and recovery-concurrency policy for several channels on one GameNode;\n- rollout and rollback behavior without active-channel live migration in the initial implementation.\n\n`FND-03`, `FND-04`, `DUR-02`, `DUR-03` and `QA-E2E-01` retain ownership of their execution, admission, persistence, anti-duplication and physical failure-evidence boundaries.\n\n## Decisions required before durable gameplay mutation",
          )

          replace_once(
              backlog,
              "- `PROD-LIVEOPS-01`, `PROD-COMPAT-01`, `SEC-CLIENT-01`, `DATA-PRIVACY-01`, `UX-I18N-A11Y-01` and `OPS-GM-01` are required before Playable Alpha operational completeness is claimed.\n- `GAME-META-01`",
              "- `PROD-LIVEOPS-01`, `PROD-COMPAT-01`, `SEC-CLIENT-01`, `DATA-PRIVACY-01`, `UX-I18N-A11Y-01` and `OPS-GM-01` are required before Playable Alpha operational completeness is claimed.\n- `PERF-01` is required before Playable Alpha claims representative-load readiness or publishes supported channel, GameNode or world capacity.\n- `OPS-CHANNEL-01` is required before automatic production channel scaling or production GameNode/channel recovery is claimed.\n- `GAME-META-01`",
          )

          replace_once(
              backlog,
              "20. Implement QA-E2E-01 incrementally as the client, protocol, admission, persistence and content prerequisites land\n21. Accept VSL-01 Foundation Vertical-Slice Programme with correlated event/audit evidence and named QA-E2E-01 tiers\n22. Execute the separately authorized vertical-slice implementation programme\n23. Accept GAME-ABILITY-01, GAME-AI-01 and GAME-INTERACTION-01 before Playable Alpha gameplay breadth is claimed\n24. Accept PROD-LIVEOPS-01, PROD-COMPAT-01, SEC-CLIENT-01, DATA-PRIVACY-01, UX-I18N-A11Y-01 and OPS-GM-01 before Playable Alpha operational completeness is claimed\n25. Complete ANL-02/ANL-03 before production-grade alpha analytics claims; defer ANL-04 until read-only investigation is authorized\n26. Activate expansion/deferred gameplay-product gates only when their milestone or explicit owner decision requires them",
              "20. Implement QA-E2E-01 incrementally as the client, protocol, admission, persistence and content prerequisites land\n21. Accept PERF-01 before publishing supported capacity or claiming representative-load readiness\n22. Accept OPS-CHANNEL-01 before automatic production channel scaling or production recovery behavior is claimed\n23. Accept VSL-01 Foundation Vertical-Slice Programme with correlated event/audit evidence and named QA-E2E-01 tiers\n24. Execute the separately authorized vertical-slice implementation programme\n25. Accept GAME-ABILITY-01, GAME-AI-01 and GAME-INTERACTION-01 before Playable Alpha gameplay breadth is claimed\n26. Accept PROD-LIVEOPS-01, PROD-COMPAT-01, SEC-CLIENT-01, DATA-PRIVACY-01, UX-I18N-A11Y-01 and OPS-GM-01 before Playable Alpha operational completeness is claimed\n27. Complete ANL-02/ANL-03 before production-grade alpha analytics claims; defer ANL-04 until read-only investigation is authorized\n28. Activate expansion/deferred gameplay-product gates only when their milestone or explicit owner decision requires them",
          )

          replace_once(
              backlog,
              "- `ANL-02`/`ANL-03` are required before production-grade balance/world and economy/security analytics claims; `ANL-04` remains a later read-only investigation gate.\n\n## Current next action",
              "- `ANL-02`/`ANL-03` are required before production-grade balance/world and economy/security analytics claims; `ANL-04` remains a later read-only investigation gate.\n- `PERF-01` must be accepted before publishing player/channel/GameNode/world capacity claims or calling Playable Alpha representative-load ready.\n- `OPS-CHANNEL-01` must be accepted before automatic production channel scaling or production GameNode/channel recovery behavior is claimed.\n\n## Current next action",
          )

          replace_once(
              register,
              "| `protocol-canary` fixed as reference-only evidence and excluded from every production runtime/dependency/fallback path | `ACCEPTED` | ADR-0008 |",
              "| `protocol-canary` fixed as reference-only evidence and excluded from every production runtime/dependency/fallback path | `ACCEPTED` | ADR-0008 |\n| GameNode process identity, multithreaded single-writer execution, measured capacity, external orchestration and same-channel fenced recovery baseline | `ACCEPTED` | ADR-0009 |",
          )

          replace_once(
              register,
              "- `FND-02`, `FND-03` and `FND-04` independently gate canonical protocol, authoritative runtime and production admission/lease behavior.\n- Bounded technical spikes",
              "- `FND-02`, `FND-03` and `FND-04` independently gate canonical protocol, authoritative runtime and production admission/lease behavior.\n- ADR-0009 fixes the GameNode/process/container boundary and recovery invariants; `PERF-01` gates supported capacity claims and `OPS-CHANNEL-01` gates automatic production channel scaling and claimed production recovery behavior.\n- Bounded technical spikes",
          )

          replace_once(
              register,
              "- Freeze quantitative targets for players/channel, channels/node, tick budget, latency, reconnect, memory, startup, bundle size and database throughput.\n\n### `ALPHA-MILESTONE-01`",
              "- Consume `PERF-01` for players/channel, channels/GameNode, logical-world capacity, tick/scheduling budget, latency, reconnect, memory, startup and database-throughput targets.\n\n### `PERF-01` — Capacity, Performance and Scalability\n\n- Status: `REQUIRED_FOR_ALPHA`.\n- Define named reference hardware and supported deployment cells.\n- Freeze latency, scheduling, queue-age, resource and overload service objectives.\n- Use representative movement, hunting, crowd, mass-combat, raid, reconnect-storm, persistence, noisy-neighbor, recovery and soak workloads.\n- Establish separate channel, GameNode and logical-world capacity limits with accepted safety headroom.\n- Record exact artifact, content, ruleset, protocol, topology and first violated objective for every supported claim.\n- Block published production capacity claims and representative-load readiness until reproducible evidence exists.\n\n### `OPS-CHANNEL-01` — GameNode Deployment and Dynamic Channel Orchestration\n\n- Status: `REQUIRED_FOR_ALPHA` for automatic production scaling and claimed production recovery behavior.\n- Define process/container packaging, external orchestrator authority, registration, health, readiness and capacity reporting.\n- Freeze channel placement, lifecycle, dynamic creation, hysteresis, draining and closure.\n- Define ownership-generation fencing, replacement, checkpoint, bounded replay, fresh-session reconnect and full-snapshot recovery.\n- Set reconnect grace, RPO, RTO, blast-radius and recovery-concurrency policy from named evidence.\n- Preserve the initial prohibition on active-channel live migration and silent failover to a different channel.\n\n### `ALPHA-MILESTONE-01`",
          )

          replace_once(
              register,
              "### `EXP-OPS-01` — Deployment and Operations\n\n- Status: `EXPANSION`.\n- Deployment topology, environments, configuration, secrets, discovery, health/readiness, draining, rolling updates, migrations, backup and disaster recovery.",
              "### `EXP-OPS-01` — Deployment and Operations\n\n- Status: `EXPANSION`.\n- Broader environment, configuration, secret, rolling-update, migration, backup and disaster-recovery architecture.\n- Consume `OPS-CHANNEL-01` for GameNode process/container lifecycle, channel placement, dynamic scaling, fencing and reconnect recovery instead of defining a competing control plane.",
          )

          replace_once(
              register,
              "15. ADR-0008 is binding on `FND-01`, `VSL-02`, `FND-02` and all later client/server packages; no task may reintroduce Canary into production through an optional feature, fallback, compatibility listener or intermediate translation model.\n\n## Current next action",
              "15. ADR-0008 is binding on `FND-01`, `VSL-02`, `FND-02` and all later client/server packages; no task may reintroduce Canary into production through an optional feature, fallback, compatibility listener or intermediate translation model.\n16. ADR-0009 is binding on runtime, performance and operations packages: `NodeId` identifies the GameNode process runtime rather than a physical host, each channel retains one logical writer, capacity claims require `PERF-01`, and automatic production scaling/recovery claims require `OPS-CHANNEL-01`.\n\n## Current next action",
          )

          replace_once(
              matrix,
              "Status: architecture baseline supporting ADR-0001  ",
              "Status: architecture baseline supporting ADR-0001 and clarified by ADR-0009  ",
          )

          replace_once(
              matrix,
              "| Node | Physical runtime placement only; never a product identity. |",
              "| Host / container | Physical or operating-system deployment placement; never a gameplay product identity. |\n| GameNode | Logical runtime identity and lifecycle of one game-server process, identified by `NodeId`; not a host or orchestrator node. |",
          )

          replace_once(
              matrix,
              "| Public map runtime overlay | `ChannelRuntime` | Channel | Authoritative immediate | Never shared implicitly | Separate per channel |",
              "| Public map runtime overlay | `ChannelRuntime` | Channel | Authoritative immediate | Never shared implicitly | Separate per channel |\n| Channel runtime ownership and placement | `ChannelRuntime` on the assigned GameNode | Channel + GameNode | Authoritative immediate + ownership-generation fencing | `ChannelId` remains stable across safe restart or relocation | One logical writer per channel |",
          )

          replace_once(
              matrix,
              "| Metrics | Observability system | Node/Channel/World labels | Eventual | Aggregated without becoming authority | Non-authoritative |",
              "| Metrics | Observability system | GameNode/Channel/World labels | Eventual | Aggregated without becoming authority | Non-authoritative |",
          )

          replace_once(
              matrix,
              "- channel drain and crash recovery timing;",
              "- exact channel drain, checkpoint, replay, reconnect-grace, RPO and RTO values under `FND-03`, `DUR-02` and `OPS-CHANNEL-01`;",
          )

          Path(".github/workflows/temporary-sync-adr-0009.yml").unlink()

      - name: Validate governance and architecture links
        run: python tools/agents/validate_governance.py

      - name: Commit synchronized architecture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture docs/agents/tasks/active/OTV2-20260805-sync-adr-0009-registers.md .github/workflows/temporary-sync-adr-0009.yml
          git commit -m "docs(architecture): synchronize ADR-0009 registers"
          git push origin HEAD:docs/sync-adr-0009-registers
