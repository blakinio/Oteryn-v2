name: Temporary complete architecture state synchronization

on:
  push:
    branches:
      - docs/sync-architecture-state-20260806

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sync-architecture-state-20260806
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize remaining current-state documents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          adr = "docs/architecture/ADR-0010-reference-and-evolved-world-product-profiles.md"
          replace_once(
              adr,
              "- `FND-01` remains the immediate next action.\n- This ADR does not authorize implementation by itself.\n- This ADR does not block the controlled client migration because both profiles share the same canonical foundation.\n- Broad gameplay/content design must not contradict this profile model while `GAME-VISION-01` remains unresolved.",
              "- `FND-01`, `VSL-02` and the atomic destination cutover are complete.\n- The remaining cutover action is the source-only `blakinio/otclient` historical marker; `FND-ID-01` follows after that closeout is merged and verified.\n- This ADR does not authorize implementation by itself.\n- Broad gameplay/content design must not contradict this profile model while `GAME-VISION-01` remains unresolved.",
          )

          product = "docs/architecture/PRODUCT_DIRECTION_BASELINE.md"
          replace_once(product, "- Date: 2026-08-05", "- Date: 2026-08-06")
          replace_once(
              product,
              "- `FND-01` remains the immediate programme action.\n- This baseline does not block workspace/client migration because both profiles require the same canonical foundation.",
              "- `FND-01`, `VSL-02` and the atomic destination cutover are complete.\n- The remaining cutover action is the source-only `blakinio/otclient` historical marker; `FND-ID-01` follows after that closeout is merged and verified.\n- Both profile families continue to share the same canonical workspace, client and foundation.",
          )

          horizon = "docs/architecture/GAMEPLAY_AND_PRODUCT_ARCHITECTURE_HORIZON.md"
          replace_once(horizon, "- Date: 2026-08-05", "- Date: 2026-08-06")
          replace_once(
              horizon,
              "The immediate programme action remains `FND-01`. The gates below become active only when their stated dependencies and milestone require them.",
              "The immediate programme action is the source-only `blakinio/otclient` historical marker for the completed destination cutover. After that closeout is merged and verified, `FND-ID-01` is the next architecture gate. The gates below become active only when their stated dependencies and milestone require them.",
          )

          task = "docs/agents/tasks/active/OTV2-20260806-synchronize-architecture-state.md"
          replace_once(
              task,
              "  - docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md\n  - docs/agents/tasks/active/OTV2-20260805-foundation-preimplementation-contracts.md",
              "  - docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md\n  - docs/architecture/ADR-0010-reference-and-evolved-world-product-profiles.md\n  - docs/architecture/PRODUCT_DIRECTION_BASELINE.md\n  - docs/architecture/GAMEPLAY_AND_PRODUCT_ARCHITECTURE_HORIZON.md\n  - docs/agents/tasks/active/OTV2-20260805-foundation-preimplementation-contracts.md",
          )
          replace_once(
              task,
              "  - docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md\ndepends_on:",
              "  - docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md\n  - docs/architecture/ADR-0010-reference-and-evolved-world-product-profiles.md\n  - docs/architecture/PRODUCT_DIRECTION_BASELINE.md\n  - docs/architecture/GAMEPLAY_AND_PRODUCT_ARCHITECTURE_HORIZON.md\ndepends_on:",
          )
          replace_once(
              task,
              "- [x] ADR-0001 aligns `NodeId` with ADR-0009 as the GameNode process-runtime identity.\n- [x] No runtime, Cargo, workflow, external-repository or product implementation remains in the final diff.",
              "- [x] ADR-0001 aligns `NodeId` with ADR-0009 as the GameNode process-runtime identity.\n- [x] ADR-0010, the product baseline and the gameplay/product horizon no longer name `FND-01` as the current action.\n- [x] No runtime, Cargo, workflow, external-repository or product implementation remains in the final diff.",
          )
          replace_once(
              task,
              "- ADR-0001 retained an obsolete `NodeId` description that allowed host/process overloading despite ADR-0009.",
              "- ADR-0001 retained an obsolete `NodeId` description that allowed host/process overloading despite ADR-0009.\n- ADR-0010, the product baseline and the gameplay/product horizon retained stale programme-effect statements naming `FND-01` as current.",
          )
          replace_once(
              task,
              "last_progress: Synchronized the canonical registers, ADR-0001 terminology and foundation programme checkpoint on draft PR #54.",
              "last_progress: Synchronized all current-state architecture surfaces, including the registers, ADR-0001/ADR-0010, product baseline, gameplay/product horizon and foundation programme checkpoint on draft PR #54.",
          )
          PY

      - name: Commit documentation-only completion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/ADR-0010-reference-and-evolved-world-product-profiles.md \
            docs/architecture/PRODUCT_DIRECTION_BASELINE.md \
            docs/architecture/GAMEPLAY_AND_PRODUCT_ARCHITECTURE_HORIZON.md \
            docs/agents/tasks/active/OTV2-20260806-synchronize-architecture-state.md
          git diff --cached --check
          git commit -m "docs(architecture): complete post-cutover synchronization"
          git push origin HEAD:docs/sync-architecture-state-20260806
