name: Temporary stale architecture state audit

on:
  push:
    branches:
      - docs/sync-architecture-state-20260806

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sync-architecture-state-20260806
          fetch-depth: 0
          persist-credentials: false
      - name: Find stale programme-state statements
        shell: bash
        run: |
          set +e
          grep -R -n -E 'FND-01.{0,100}(immediate|next action)|((immediate|next action).{0,100}FND-01)|no accepted canonical root Cargo workspace|existing Rust client remains in `blakinio/otclient|before creating or completing the canonical root Cargo workspace' \
            docs/architecture docs/agents/tasks/active
          exit 0
