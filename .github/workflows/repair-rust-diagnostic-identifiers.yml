name: Repair Rust diagnostic identifiers

on:
  push:
    branches: [migrate/rust-client-cutover-c923ad8]
    paths: ['.github/workflows/repair-rust-diagnostic-identifiers.yml']

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migrate/rust-client-cutover-c923ad8
      - name: Remove legacy diagnostic aliases
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/diagnostics/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          session_count = text.count('SessionGeneration')
          task_count = text.count('TaskGeneration')
          if session_count < 5 or task_count < 5:
              raise SystemExit(f'unexpected alias counts: session={session_count}, task={task_count}')
          text = text.replace('ClientSessionEpoch as SessionGeneration', 'ClientSessionEpoch')
          text = text.replace('ClientTaskGeneration as TaskGeneration', 'ClientTaskGeneration')
          text = text.replace('SessionGeneration', 'ClientSessionEpoch')
          text = text.replace('TaskGeneration', 'ClientTaskGeneration')
          if 'SessionGeneration' in text or 'TaskGeneration' in text:
              raise SystemExit('legacy diagnostic aliases remain')
          path.write_text(text, encoding='utf-8')
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/diagnostics/src/lib.rs
          git commit -m "fix(rust): use provisional client identifier names"
          git push origin HEAD:migrate/rust-client-cutover-c923ad8
