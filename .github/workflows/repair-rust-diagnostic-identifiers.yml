name: Repair Rust diagnostic identifiers

on:
  push:
    branches: [migrate/rust-client-cutover-c923ad8]
    paths: ['.github/workflows/repair-rust-diagnostic-identifiers.yml']

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migrate/rust-client-cutover-c923ad8
      - name: Remove legacy diagnostic aliases
        shell: python
        run: |
          import re
          from pathlib import Path
          path = Path('crates/diagnostics/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          if len(re.findall(r'\bSessionGeneration\b', text)) < 5:
              raise SystemExit('unexpected SessionGeneration alias count')
          if len(re.findall(r'\bTaskGeneration\b', text)) < 5:
              raise SystemExit('unexpected TaskGeneration alias count')
          text = text.replace('ClientSessionEpoch as SessionGeneration', 'ClientSessionEpoch')
          text = text.replace('ClientTaskGeneration as TaskGeneration', 'ClientTaskGeneration')
          text = re.sub(r'\bSessionGeneration\b', 'ClientSessionEpoch', text)
          text = re.sub(r'\bTaskGeneration\b', 'ClientTaskGeneration', text)
          if re.search(r'\b(SessionGeneration|TaskGeneration)\b', text):
              raise SystemExit('legacy diagnostic aliases remain')
          path.write_text(text, encoding='utf-8')
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/diagnostics/src/lib.rs
          git commit -m "fix(rust): use provisional client identifier names"
          git push origin HEAD:migrate/rust-client-cutover-c923ad8
