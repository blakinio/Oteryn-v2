name: Repair Game Intelligence architecture audit findings

on:
  push:
    branches:
      - docs/game-intelligence-architecture-20260805

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore repair game intelligence architecture audit findings' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: docs/game-intelligence-architecture-20260805
          fetch-depth: 0

      - name: Repair and validate architecture package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          programme = "docs/agents/tasks/active/OTV2-20260805-foundation-preimplementation-contracts.md"
          replace_once(
              programme,
              "8. durable checkpoint and safe logout;\n8. relog to another channel with shared character state preserved;\n9. rejection of a simultaneous second session;\n10. isolation of channel-local state and preservation of world-shared state.\n",
              "8. durable checkpoint and safe logout;\n9. relog to another channel with shared character state preserved;\n10. rejection of a simultaneous second session;\n11. isolation of channel-local state and preservation of world-shared state.\n",
          )
          replace_once(
              programme,
              "- ADR-0001 through ADR-0006 and their lifecycle closeouts/package state are merged or tracked on `main` as applicable.\n",
              "- ADR-0001 through ADR-0006 are accepted; package lifecycle records are tracked separately.\n",
          )
          replace_once(
              programme,
              "Every package PR must challenge omitted boundaries, circular dependencies, placeholder crates, duplicate authority, unsafe concurrency/replay/recovery, item duplication, cross-repository rollout conflicts, unsupported runtime claims, premature freezing and stale decisions.\n",
              "Every package PR must challenge omitted boundaries, circular dependencies, placeholder crates, duplicate authority, unsafe concurrency/replay/recovery, item duplication, missing provenance/outbox evidence, telemetry/audit durability confusion, privacy/retention/access gaps, AI mutation authority, cross-repository rollout conflicts, unsupported runtime claims, premature freezing and stale decisions.\n",
          )

          register = "docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md"
          replace_once(
              register,
              "- Status: `BLOCKS_DURABLE_GAMEPLAY` where `DUR-02`/`DUR-03` require transactional audit evidence.\n",
              "- Status: `BLOCKS_DURABLE_GAMEPLAY`\n- Applies before `DUR-02`/`DUR-03` finalize transactional audit evidence.\n",
          )
          replace_once(
              register,
              "- Status: `REQUIRED_FOR_ALPHA`.\n",
              "- Status: `REQUIRED_FOR_ALPHA`\n",
          )
          replace_once(
              register,
              "- Status: `REQUIRED_FOR_ALPHA` for a production-grade integrity/security analytics claim.\n",
              "- Status: `REQUIRED_FOR_ALPHA`\n- Required for a production-grade integrity/security analytics claim.\n",
          )
          replace_once(
              register,
              "- Status: `EXPANSION`.\n",
              "- Status: `EXPANSION`\n",
          )

          adr = "docs/architecture/ADR-0006-game-intelligence-analytics-and-audit.md"
          replace_once(
              adr,
              "- Related: ADR-0001 through ADR-0005, `FOUNDATION_DECISION_BACKLOG.md`, `GLOBAL_ARCHITECTURE_DECISION_REGISTER.md`, `FOUNDATION_FAILURE_SCENARIOS.md`\n",
              "- Related: ADR-0001 through ADR-0005, `FOUNDATION_DECISION_BACKLOG.md`, `GLOBAL_ARCHITECTURE_DECISION_REGISTER.md`, `RESOURCE_LIMITS_REGISTRY.json`, `FOUNDATION_ERROR_VOCABULARY.md`, `FOUNDATION_FAILURE_SCENARIOS.md`\n",
          )
          reliability_anchor = (
              "- privacy/redaction failures;\n"
              "- bounded cardinality and storage growth.\n\n"
              "Replay means replaying immutable events into read-only consumers or test fixtures. It never means applying the authoritative gameplay effect again.\n"
          )
          reliability_replacement = (
              "- privacy/redaction failures;\n"
              "- bounded cardinality and storage growth.\n\n"
              "`ANL-01` must register every externally controlled memory, allocation and transfer boundary in `RESOURCE_LIMITS_REGISTRY.json`, including event-envelope and payload bytes, queue entries/bytes, batch rows/bytes, dead-letter capacity, replay batch/window, decompression, query/result/export and evidence-package limits. Durable outbox backlog is governed by explicit operational thresholds and recovery behavior; it is never silently discarded to satisfy a memory limit.\n\n"
              "Public and cross-component failures must map to `FOUNDATION_ERROR_VOCABULARY.md`. At minimum, `ANL-01` must define stable contract-owned outcomes for telemetry drop/capacity, audit dependency unavailable, event/schema rejection, duplicate or ordering conflict, replay conflict, privacy-policy rejection and investigation access denial without exposing private payloads.\n\n"
              "The following stable scenarios from `FOUNDATION_FAILURE_SCENARIOS.md` are mandatory inputs to the owning contracts: `FS-ANALYTICS-TELEMETRY-OVERFLOW`, `FS-AUDIT-OUTBOX-BACKLOG`, `FS-EVENT-DUPLICATE-DELIVERY`, `FS-EVENT-OUT-OF-ORDER`, `FS-AUDIT-MUTATION-MISMATCH`, `FS-ANALYTICS-PRIVACY-POLICY`, `FS-DETECTOR-FALSE-POSITIVE` and `FS-INVESTIGATION-MUTATION-ATTEMPT`.\n\n"
              "Replay means replaying immutable events into read-only consumers or test fixtures. It never means applying the authoritative gameplay effect again.\n"
          )
          replace_once(adr, reliability_anchor, reliability_replacement)
          replace_once(
              adr,
              "- analytics storage failure cannot normally stall combat;\n",
              "- best-effort analytics consumer or storage failure cannot normally stall combat;\n",
          )

          backlog = "docs/architecture/FOUNDATION_DECISION_BACKLOG.md"
          replace_once(
              backlog,
              "- resource limits, backpressure, dead-letter lifecycle and observability;\n- privacy classes, pseudonymous identity, access roles, retention, deletion/anonymization and legal hold;\n- golden fixtures and duplicate/out-of-order/schema-evolution tests.\n",
              "- resource limits registered in `RESOURCE_LIMITS_REGISTRY.json`, backpressure, dead-letter lifecycle and observability;\n- stable error/outcome mapping through `FOUNDATION_ERROR_VOCABULARY.md`;\n- privacy classes, pseudonymous identity, access roles, retention, deletion/anonymization and legal hold;\n- named analytics/audit/privacy/investigation scenarios from `FOUNDATION_FAILURE_SCENARIOS.md`;\n- golden fixtures and duplicate/out-of-order/schema-evolution tests.\n",
          )

          failures = "docs/contracts/FOUNDATION_FAILURE_SCENARIOS.md"
          failure_anchor = "| `FS-CLIENT-CUTOVER-ROLLBACK` | Migrated client workspace fails acceptance | Development source of truth and exact rollback path remain unambiguous. |\n"
          failure_rows = (
              failure_anchor
              + "| `FS-ANALYTICS-TELEMETRY-OVERFLOW` | Best-effort gameplay telemetry queue reaches its registered bound | Gameplay follows the explicit fail-open/drop policy; loss is counted, bounded and never misrepresented as complete evidence. |\n"
              + "| `FS-AUDIT-OUTBOX-BACKLOG` | Durable audit/outbox consumer is unavailable or falls behind | Authoritative records are not silently discarded; backlog, recovery and owning transaction behavior follow the accepted durable contract. |\n"
              + "| `FS-EVENT-DUPLICATE-DELIVERY` | One event is delivered more than once | Consumer deduplication returns one analytical/provenance effect and never replays gameplay mutation. |\n"
              + "| `FS-EVENT-OUT-OF-ORDER` | Related events arrive outside causal or transaction order | Consumer buffers, rejects or reconciles deterministically without inventing state or enforcement. |\n"
              + "| `FS-AUDIT-MUTATION-MISMATCH` | Authoritative mutation and required audit/outbox evidence disagree | The mismatch cannot commit or remain silent; recovery produces named evidence and preserves authoritative invariants. |\n"
              + "| `FS-ANALYTICS-PRIVACY-POLICY` | Event/dataset lacks an accepted purpose, privacy class, retention or access policy | Production collection/projection fails closed for that class with no unclassified player-linked data. |\n"
              + "| `FS-DETECTOR-FALSE-POSITIVE` | Analytics detector raises an incorrect security anomaly | No automatic sanction or mutation occurs; evidence, detector version, human review and disposition remain auditable. |\n"
              + "| `FS-INVESTIGATION-MUTATION-ATTEMPT` | Investigation or AI component attempts a runtime/database mutation | Least-privilege credentials make the mutation impossible and the attempt is audited. |\n"
          )
          replace_once(failures, failure_anchor, failure_rows)

          task = "docs/agents/tasks/active/OTV2-20260805-game-intelligence-architecture.md"
          replace_once(task, "pr: null\n", "pr: \"#17\"\n")
          replace_once(task, "updated_at: 2026-08-05T14:11:00+02:00\n", "updated_at: 2026-08-05T14:35:00+02:00\n")
          replace_once(
              task,
              "  - docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md\n",
              "  - docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md\n  - docs/contracts/FOUNDATION_FAILURE_SCENARIOS.md\n",
          )
          replace_once(
              task,
              "public_contracts:\n  - docs/architecture/ADR-0006-game-intelligence-analytics-and-audit.md\n",
              "public_contracts:\n  - docs/architecture/ADR-0006-game-intelligence-analytics-and-audit.md\n  - docs/contracts/FOUNDATION_FAILURE_SCENARIOS.md\n",
          )
          replace_once(
              task,
              "last_progress: ADR-0006 and the ANL-01 through ANL-04 programme integration were drafted from pinned Canary/Otheryn evidence.\n",
              "last_progress: PR #17 contains ADR-0006, ANL-01 through ANL-04 integration, named failure scenarios and repaired audit findings.\n",
          )
          replace_once(task, "pr: null\n", "pr: \"#17\"\n")
          replace_once(
              task,
              "next_action: Open the package PR, run exact-head Agent governance, perform the full-diff audit and close the package lifecycle.\n",
              "next_action: Run exact-head Agent governance, complete the final full-diff audit and close PR #17 through squash merge and separate archive.\n",
          )
          PY

          python tools/agents/validate_governance.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture docs/contracts docs/agents
          git commit -m "docs(architecture): close game intelligence audit gaps"
          git push origin HEAD:docs/game-intelligence-architecture-20260805
