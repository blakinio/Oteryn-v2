name: Temporary gap status definition

on:
  push:
    branches:
      - docs/register-architecture-analysis-gaps

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/register-architecture-analysis-gaps
          fetch-depth: 0
      - name: Define partial acceptance status
        shell: python
        run: |
          from pathlib import Path
          path = Path("docs/architecture/ARCHITECTURE_ANALYSIS_GAP_REGISTER.md")
          text = path.read_text(encoding="utf-8")
          old = "- **ACCEPTED** — an ADR or accepted contract already freezes the relevant boundary;\n- **REGISTERED_UNRESOLVED** — an existing gate names the area, but its detailed contract is not accepted;\n"
          new = "- **ACCEPTED** — an ADR or accepted contract already freezes the relevant boundary;\n- **PARTIALLY_ACCEPTED** — an ADR freezes a high-level direction, while a registered gate still must resolve measurable scope and detailed behavior;\n- **REGISTERED_UNRESOLVED** — an existing gate names the area, but its detailed contract is not accepted;\n"
          if new not in text:
              if old not in text:
                  raise SystemExit("gap status vocabulary anchor not found")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit status definition
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Status already defined."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/ARCHITECTURE_ANALYSIS_GAP_REGISTER.md
          git commit -m "docs(architecture): define partial acceptance status"
          git push origin HEAD:docs/register-architecture-analysis-gaps
