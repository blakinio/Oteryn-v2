name: Temporary product direction register sync

on:
  push:
    branches:
      - docs/register-architecture-analysis-gaps

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/register-architecture-analysis-gaps
          fetch-depth: 0
      - name: Patch canonical registers
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Global register: accepted source, execution rule and dedicated gate.
          replace_once(
              "docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md",
              "| GameNode process identity, multithreaded single-writer execution, measured capacity, external orchestration and same-channel fenced recovery baseline | `ACCEPTED` | ADR-0009 |\n",
              "| GameNode process identity, multithreaded single-writer execution, measured capacity, external orchestration and same-channel fenced recovery baseline | `ACCEPTED` | ADR-0009 |\n| Reference and evolved world product profiles over one engine, client and `protocol-oteryn`, with isolated world-scoped gameplay value | `ACCEPTED` | ADR-0010 and `PRODUCT_DIRECTION_BASELINE.md` |\n",
          )
          replace_once(
              "docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md",
              "- ADR-0009 fixes the GameNode/process/container boundary and recovery invariants; `PERF-01` gates supported capacity claims and `OPS-CHANNEL-01` gates automatic production channel scaling and claimed production recovery behavior.\n",
              "- ADR-0009 fixes the GameNode/process/container boundary and recovery invariants; `PERF-01` gates supported capacity claims and `OPS-CHANNEL-01` gates automatic production channel scaling and claimed production recovery behavior.\n- ADR-0010 fixes reference and evolved worlds as versioned product/ruleset/content profiles over one engine, client and `protocol-oteryn`; `GAME-VISION-01` must define measurable parity scope and launch strategy before broad gameplay/content production.\n",
          )
          replace_once(
              "docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md",
              "## Stage A — foundation and layer gates\n\n### `FND-01` — Workspace, Dependency and Existing-Rust Migration Contract\n",
              "## Stage A — foundation and layer gates\n\n### `GAME-VISION-01` — Product Vision, Parity Scope and World Profile Contract\n\n- Status: `BLOCKS_LAYER_IMPLEMENTATION` for broad gameplay/content production; does not block `FND-01` or `VSL-02`.\n- Refine ADR-0010 into measurable product pillars, player promise, parity scope and anti-pillars.\n- Decide whether reference worlds track a pinned release, dated behavior baseline or continuously updated target.\n- Define the first-launch profile strategy, initial intentional Oteryn differences and player-facing profile disclosure.\n- Preserve one engine, client and `protocol-oteryn`; differences remain versioned ruleset/content/product profiles.\n- Preserve default world-scoped character/economy isolation until a dedicated transfer contract proves safety.\n- Link parity evidence, legal/provenance substitutions, profile-specific acceptance and cross-profile isolation scenarios.\n\n### `FND-01` — Workspace, Dependency and Existing-Rust Migration Contract\n",
          )

          # Foundation backlog: stable gate, accepted owner direction and layer gate.
          replace_once(
              "docs/architecture/FOUNDATION_DECISION_BACKLOG.md",
              "- `FND-04` — Identity, Game Session, Admission and Character Lease Contract.\n",
              "- `FND-04` — Identity, Game Session, Admission and Character Lease Contract.\n- `GAME-VISION-01` — Product Vision, Parity Scope and World Profile Contract.\n",
          )
          replace_once(
              "docs/architecture/FOUNDATION_DECISION_BACKLOG.md",
              "Canonical decisions: ADR-0001 through ADR-0009.\n",
              "11. **Reference and evolved world product direction**\n   - Global Tibia behavioral parity is the initial reference target; controlled Oteryn improvements and original expansion may follow.\n   - reference and evolved worlds are versioned product/ruleset/content profiles over one canonical engine, native client and `protocol-oteryn`; they are not forks.\n   - reusable Platform identity may be shared, while characters, progression, items, currency, houses, market, guilds and rankings remain world-scoped by default.\n   - cross-profile gameplay-value transfer is forbidden until a dedicated contract proves conservation, balance and migration safety.\n   - `GAME-VISION-01` must define measurable parity scope, first-launch strategy and initial intentional differences before broad gameplay/content production.\n\nCanonical decisions: ADR-0001 through ADR-0010.\n",
          )
          replace_once(
              "docs/architecture/FOUNDATION_DECISION_BACKLOG.md",
              "- `FND-04` gates production admission, Game Session validation and character lease behavior.\n",
              "- `FND-04` gates production admission, Game Session validation and character lease behavior.\n- `GAME-VISION-01` gates broad gameplay/content production claims, but does not block `FND-01`, `VSL-02` or shared-foundation migration work.\n",
          )

          # Gameplay/product horizon: make the product gate explicit.
          replace_once(
              "docs/architecture/GAMEPLAY_AND_PRODUCT_ARCHITECTURE_HORIZON.md",
              "- `FND-01` through `FND-04` for workspace, protocol, runtime and admission;\n",
              "- `GAME-VISION-01` for measurable parity scope, product pillars and reference/evolved profile strategy;\n- `FND-01` through `FND-04` for workspace, protocol, runtime and admission;\n",
          )
          replace_once(
              "docs/architecture/GAMEPLAY_AND_PRODUCT_ARCHITECTURE_HORIZON.md",
              "# Core gameplay domain gates\n",
              "# Product direction gate\n\n## `GAME-VISION-01` — Product Vision, Parity Scope and World Profile Contract\n\n- Status: `BLOCKS_LAYER_IMPLEMENTATION` for broad gameplay/content production.\n- Does not block `FND-01`, `VSL-02` or shared-foundation migration work.\n- Must refine ADR-0010 and `PRODUCT_DIRECTION_BASELINE.md` before large-scale mechanics/content implementation.\n\nMust decide:\n\n- measurable player promise, design pillars and anti-pillars;\n- named Global Tibia parity baseline and lawful evidence model;\n- pinned, dated or continuously tracking reference-world policy;\n- reference versus evolved profile launch order and population strategy;\n- first intentional Oteryn improvements and their acceptance evidence;\n- user-facing profile disclosure, naming and transfer restrictions;\n- profile revision, compatibility, migration and rollback expectations;\n- product success measures beyond technical correctness.\n\nMust preserve:\n\n- one canonical engine, client and `protocol-oteryn`;\n- explicit versioned product/ruleset/content profiles rather than forks;\n- default world-scoped character and economy isolation;\n- no proprietary code, protocol or asset copying under a parity claim.\n\n# Core gameplay domain gates\n",
          )
          replace_once(
              "docs/architecture/GAMEPLAY_AND_PRODUCT_ARCHITECTURE_HORIZON.md",
              "9. Any future implementation package must update this horizon, the global register and the corresponding dedicated contract status.\n",
              "9. Any future implementation package must update this horizon, the global register and the corresponding dedicated contract status.\n10. `GAME-VISION-01` must preserve ADR-0010 and may not turn reference/evolved profiles into protocol, engine, client or repository forks.\n",
          )

          # Gap register: reconcile the newly accepted direction without pretending the detailed vision is complete.
          replace_once(
              "docs/architecture/ARCHITECTURE_ANALYSIS_GAP_REGISTER.md",
              "- GameNode process identity, one logical writer per channel, capacity-evidence discipline and recovery baseline.\n",
              "- GameNode process identity, one logical writer per channel, capacity-evidence discipline and recovery baseline.\n- Global Tibia parity as the initial product reference plus optional reference/evolved world profiles over one engine, client and `protocol-oteryn`, with default world-scoped gameplay-value isolation (ADR-0010).\n",
          )
          replace_once(
              "docs/architecture/ARCHITECTURE_ANALYSIS_GAP_REGISTER.md",
              "- Coverage status: **NEWLY_IDENTIFIED**\n- Recommended candidate gate: `GAME-VISION-01` — Product Vision and Core Gameplay Contract\n- Priority: parallel analysis with `FND-01`; must be accepted before broad gameplay and content production\n\nStill unresolved:\n",
              "- Coverage status: **PARTIALLY_ACCEPTED** by ADR-0010 and `PRODUCT_DIRECTION_BASELINE.md`\n- Registered gate: `GAME-VISION-01` — Product Vision, Parity Scope and World Profile Contract\n- Priority: parallel analysis with `FND-01`; must be accepted before broad gameplay and content production\n\nAccepted direction: begin from Global Tibia behavioral parity; permit separate reference and evolved Oteryn worlds over one shared engine/client/protocol; keep gameplay value world-scoped by default.\n\nStill unresolved:\n",
          )
          replace_once(
              "docs/architecture/ARCHITECTURE_ANALYSIS_GAP_REGISTER.md",
              "- whether classic and modern rulesets are equal products, migrations, optional profiles or one primary experience with compatibility profiles;\n",
              "- exact relationship among current-Global, historical-classic and evolved profiles, including which profiles are actual launch products;\n",
          )
          replace_once(
              "docs/architecture/ARCHITECTURE_ANALYSIS_GAP_REGISTER.md",
              "2. `GAME-VISION-01` candidate — product vision and core gameplay loop, in parallel without blocking workspace analysis.\n",
              "2. `GAME-VISION-01` — refine ADR-0010 into measurable parity scope, product pillars and launch strategy, in parallel without blocking workspace analysis.\n",
          )

          # Detailed baseline points to the governing ADR.
          replace_once(
              "docs/architecture/PRODUCT_DIRECTION_BASELINE.md",
              "- Status: Accepted owner direction baseline\n",
              "- Status: Accepted owner direction baseline\n- Canonical decision: ADR-0010\n",
          )
      - name: Commit synchronized registers
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Registers already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture
          git commit -m "docs(architecture): synchronize product profile decision"
          git push origin HEAD:docs/register-architecture-analysis-gaps
