name: Align terminal Rust workflow audit

on:
  push:
    branches:
      - migrate/rust-client-cutover-c923ad8
    paths:
      - '.github/workflows/patch-rust-evidence-coordinator.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migrate/rust-client-cutover-c923ad8

      - name: Permit only the active evidence and merge coordinators
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/finalize-rust-cutover-evidence.yml')
          text = path.read_text(encoding='utf-8')
          old = "and path.name != 'finalize-rust-cutover-evidence.yml'"
          new = (
              "and path.name not in {"
              "'finalize-rust-cutover-evidence.yml', "
              "'finalize-rust-merge-coordinator.yml'"
              "}"
          )
          if old not in text:
              raise SystemExit('terminal workflow allowlist insertion point not found')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Remove patch workflow and commit
        run: |
          git rm .github/workflows/patch-rust-evidence-coordinator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/finalize-rust-cutover-evidence.yml
          git commit -m "ci(rust): align terminal workflow isolation audit"
          git push origin HEAD:migrate/rust-client-cutover-c923ad8
