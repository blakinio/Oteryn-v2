name: Run corrected architecture state synchronization

on:
  push:
    branches:
      - docs/sync-architecture-state-20260806

permissions:
  contents: write

concurrency:
  group: corrected-architecture-state-sync-20260806
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sync-architecture-state-20260806
          fetch-depth: 0
          persist-credentials: true

      - name: Execute corrected synchronization script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-architecture-state-sync.yml').read_text(encoding='utf-8')
          opening = "          python - <<'PY'\n"
          start = workflow.index(opening) + len(opening)
          end = workflow.index("\n          PY\n", start)
          script_lines = []
          for line in workflow[start:end].splitlines():
              if not line.startswith('          '):
                  raise SystemExit(f'unexpected embedded-script indentation: {line!r}')
              script_lines.append(line[10:])

          foundation = next(i for i, line in enumerate(script_lines) if '# Foundation backlog.' in line)
          loop_start = next(i for i in range(foundation, len(script_lines)) if script_lines[i].strip() == 'for old, new in [')
          loop_end = next(i for i in range(loop_start, len(script_lines)) if script_lines[i].strip() == 'replace_once(backlog, old, new)')
          del script_lines[loop_start:loop_end + 1]

          script = '\n'.join(script_lines) + '\n'
          exec(compile(script, '<corrected-architecture-sync>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Commit synchronized documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/ADR-0001-native-rust-multichannel-platform.md \
            docs/architecture/ARCHITECTURE_ANALYSIS_GAP_REGISTER.md \
            docs/architecture/FOUNDATION_DECISION_BACKLOG.md \
            docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md \
            docs/agents/tasks/active/OTV2-20260805-foundation-preimplementation-contracts.md \
            docs/agents/tasks/active/OTV2-20260806-synchronize-architecture-state.md
          git diff --cached --check
          git commit -m "docs(architecture): synchronize post-cutover state"
          git push origin HEAD:docs/sync-architecture-state-20260806
