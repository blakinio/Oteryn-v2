name: Merge gate

run-name: Merge gate • pull_request • ${{ github.event.pull_request.number }}

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions: {}

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Merge gate / scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.detect.outputs.pr_number }}
      target_sha: ${{ steps.detect.outputs.target_sha }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - name: Resolve and validate exact pull request head
        id: detect
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          repository = os.environ['REPOSITORY']
          number_text = os.environ.get('EVENT_PR_NUMBER', '').strip()
          expected_head = os.environ.get('EVENT_PR_HEAD_SHA', '').strip().lower()
          errors: list[str] = []

          if re.fullmatch(r'[1-9][0-9]*', number_text) is None:
              errors.append('pull request number must be a positive integer')
          if re.fullmatch(r'[0-9a-f]{40}', expected_head) is None:
              errors.append('pull request head SHA must be a full lowercase 40-character SHA')

          if errors:
              for error in errors:
                  print(f'- {error}', file=sys.stderr)
              raise SystemExit(1)

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'Oteryn-v2-merge-gate',
          }

          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/pulls/{number_text}',
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pull = json.load(response)

          state = pull.get('state', '')
          head_sha = pull.get('head', {}).get('sha', '').lower()
          head_repository = pull.get('head', {}).get('repo', {}).get('full_name', '')
          base_ref = pull.get('base', {}).get('ref', '')
          base_sha = pull.get('base', {}).get('sha', '').lower()
          changed_files = pull.get('changed_files')

          if state != 'open':
              errors.append('merge-gate validation requires an open pull request')
          if head_sha != expected_head:
              errors.append('pull request head moved after event head was resolved')
          if head_repository != repository:
              errors.append('merge gate only accepts same-repository pull request heads')
          if base_ref != 'main':
              errors.append('merge gate only accepts pull requests targeting main')
          if re.fullmatch(r'[0-9a-f]{40}', base_sha) is None:
              errors.append('pull request base SHA is invalid')
          if not isinstance(changed_files, int) or changed_files < 0:
              errors.append('pull request changed_files count is invalid')
          elif changed_files > 3000:
              errors.append('pull request exceeds GitHub changed-files API cap of 3000; fail closed')

          files: list[str] = []
          classification_paths: list[str] = []
          page = 1
          while not errors:
              files_request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/pulls/{number_text}/files?per_page=100&page={page}',
                  headers=headers,
              )
              with urllib.request.urlopen(files_request, timeout=30) as response:
                  batch = json.load(response)
              for item in batch:
                  filename = item['filename']
                  files.append(filename)
                  classification_paths.append(filename)
                  previous_filename = item.get('previous_filename')
                  if isinstance(previous_filename, str) and previous_filename:
                      classification_paths.append(previous_filename)
              if len(batch) < 100:
                  break
              page += 1

          if not errors and len(files) != changed_files:
              errors.append(
                  f'changed-files enumeration mismatch: API reports {changed_files}, '
                  f'collected {len(files)}; fail closed'
              )

          if errors:
              for error in errors:
                  print(f'- {error}', file=sys.stderr)
              raise SystemExit(1)

          exact = {
              'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'rustfmt.toml',
              'deny.toml', 'workspace-boundaries.toml',
              '.github/workflows/rust.yml', '.github/workflows/merge-gate.yml',
          }
          prefixes = ('.cargo/', 'apps/', 'crates/', 'tests/', 'tools/', 'docs/migration/')
          rust = any(path in exact or path.startswith(prefixes) for path in classification_paths)

          print(f'Validated PR #{number_text} exact head {head_sha} against base {base_sha}.')
          print(f'Changed files: {len(files)}; Rust/workspace validation required: {rust}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'pr_number={number_text}\n')
              output.write(f'target_sha={head_sha}\n')
              output.write(f'base_sha={base_sha}\n')
              output.write(f"rust={'true' if rust else 'false'}\n")
          PY

  governance:
    name: Merge gate / governance
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify pull request metadata
        env:
          EXPECTED_HEAD: ${{ needs.scope.outputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
          PULL_NUMBER: ${{ needs.scope.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/pulls/{os.environ['PULL_NUMBER']}",
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'Oteryn-v2-merge-gate',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pull = json.load(response)

          errors: list[str] = []
          title = pull.get('title', '')
          body = pull.get('body') or ''
          if pull.get('state') != 'open':
              errors.append('merge gate requires an open pull request')
          if pull.get('head', {}).get('sha', '') != os.environ['EXPECTED_HEAD']:
              errors.append('pull request head moved after scope validation')
          if pull.get('head', {}).get('repo', {}).get('full_name') != os.environ['REPOSITORY']:
              errors.append('merge gate only accepts same-repository pull request heads')
          if pull.get('base', {}).get('ref') != 'main':
              errors.append('merge gate only accepts pull requests targeting main')

          pattern = re.compile(
              r'^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)'
              r'(\([a-z0-9][a-z0-9._/-]*\))?!?: [A-Za-z0-9].+$'
          )
          if len(title) > 72:
              errors.append('PR title must be at most 72 characters')
          if not pattern.fullmatch(title):
              errors.append('PR title must follow type(scope): imperative summary')
          for heading in ('## Summary', '## Scope', '## Validation'):
              if heading not in body:
                  errors.append(f'PR body is missing {heading}')

          if errors:
              for error in errors:
                  print(f'- {error}', file=sys.stderr)
              raise SystemExit(1)
          print(f"Validated PR metadata for exact head {os.environ['EXPECTED_HEAD']}.")
          PY

      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          persist-credentials: false

      - name: Verify checked-out SHA
        env:
          EXPECTED_SHA: ${{ needs.scope.outputs.target_sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "Validated exact checkout: $actual_sha"

      - name: Validate agent governance
        run: python tools/agents/validate_governance.py

      - name: Validate repository policy
        run: python tools/repository/validate_repository_policy.py

  rust_policy:
    name: Merge gate / Rust policy and metadata
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b310ccdc29137aa93d04d4ea6a499c4a60be25 # stable 2026-08-11
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy

      - name: Verify locked metadata
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Verify machine workspace boundaries
        run: cargo run --locked -q -p oteryn-architecture-check -- validate-boundaries

      - name: Verify migration JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path('docs/migration/rust-client-path-map.json'),
              Path('docs/migration/rust-client-provenance-plan.json'),
              Path('docs/migration/rust-client-provenance.json'),
              Path('docs/migration/rust-dependency-delta.json'),
          ):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'validated {path}')
          PY

      - name: Verify production closure negatives
        run: |
          test -f apps/client/src/main.rs
          test -f apps/client/src/windows_shell.rs
          test -f crates/input-platform/src/winit_adapter.rs
          test -f crates/renderer/src/windows.rs
          ! grep -R --line-number --fixed-strings 'native shell pre-protocol handoff validated' apps crates tests tools
          ! grep -R --line-number --fixed-strings 'window and surface integration is intentionally outside this crate boundary' apps crates tests tools
          ! grep -R --line-number --fixed-strings 'window and surface integration is intentionally outside this boundary' apps crates tests tools

  rust_linux:
    name: Merge gate / Rust Linux workspace
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b310ccdc29137aa93d04d4ea6a499c4a60be25 # stable 2026-08-11
        with:
          toolchain: 1.94.0
          components: clippy

      - name: Build workspace
        run: cargo build --workspace --all-targets --locked

      - name: Strict Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Run synthetic harness
        run: cargo run --locked -p oteryn-synthetic-client-harness

  rust_windows:
    name: Merge gate / Rust Windows client
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b310ccdc29137aa93d04d4ea6a499c4a60be25 # stable 2026-08-11
        with:
          toolchain: 1.94.0
          components: clippy

      - name: Build production client
        run: cargo build -p oteryn-client --locked --release

      - name: Strict client Clippy
        run: cargo clippy -p oteryn-client --all-targets --all-features --locked -- -D warnings

      - name: Launch visible pre-native shell smoke
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'target\release\oteryn-client.exe' -PassThru
          Start-Sleep -Seconds 2
          if ($process.HasExited) {
            throw "oteryn-client exited early with code $($process.ExitCode)"
          }
          if ($process.MainWindowHandle -eq 0) {
            Stop-Process -Id $process.Id -Force
            throw 'oteryn-client did not create a visible top-level window'
          }
          Stop-Process -Id $process.Id -Force

      - name: Run synthetic harness
        run: cargo run --locked -p oteryn-synthetic-client-harness

  dependency_review:
    name: Merge gate / dependency review
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@e34c69605e3441051bf50721da720034781f7fac # v4.8.1
        with:
          base-ref: ${{ needs.scope.outputs.base_sha }}
          head-ref: ${{ needs.scope.outputs.target_sha }}
          fail-on-severity: high

  supply_chain:
    name: Merge gate / Rust supply chain
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          persist-credentials: false

      - name: Check advisories licenses bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.0.14
        with:
          command: check advisories licenses bans sources

  codeql_actions:
    name: Merge gate / CodeQL (actions)
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      packages: read
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: actions

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

  codeql_python:
    name: Merge gate / CodeQL (python)
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
      packages: read
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

  validate:
    name: Merge gate / validate
    needs:
      - scope
      - governance
      - rust_policy
      - rust_linux
      - rust_windows
      - dependency_review
      - supply_chain
      - codeql_actions
      - codeql_python
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable gate
        env:
          SCOPE: ${{ needs.scope.result }}
          GOVERNANCE: ${{ needs.governance.result }}
          RUST_POLICY: ${{ needs.rust_policy.result }}
          RUST_LINUX: ${{ needs.rust_linux.result }}
          RUST_WINDOWS: ${{ needs.rust_windows.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency_review.result }}
          SUPPLY_CHAIN: ${{ needs.supply_chain.result }}
          CODEQL_ACTIONS: ${{ needs.codeql_actions.result }}
          CODEQL_PYTHON: ${{ needs.codeql_python.result }}
          RUST_REQUIRED: ${{ needs.scope.outputs.rust }}
        run: |
          python - <<'PY'
          import os

          required = {
              'scope': os.environ['SCOPE'],
              'governance': os.environ['GOVERNANCE'],
              'dependency-review': os.environ['DEPENDENCY_REVIEW'],
              'codeql-actions': os.environ['CODEQL_ACTIONS'],
              'codeql-python': os.environ['CODEQL_PYTHON'],
          }
          if os.environ['RUST_REQUIRED'] == 'true':
              required.update({
                  'rust-policy': os.environ['RUST_POLICY'],
                  'rust-linux': os.environ['RUST_LINUX'],
                  'rust-windows': os.environ['RUST_WINDOWS'],
                  'supply-chain': os.environ['SUPPLY_CHAIN'],
              })
          else:
              skipped = {
                  'rust-policy': os.environ['RUST_POLICY'],
                  'rust-linux': os.environ['RUST_LINUX'],
                  'rust-windows': os.environ['RUST_WINDOWS'],
                  'supply-chain': os.environ['SUPPLY_CHAIN'],
              }
              for name, result in skipped.items():
                  if result != 'skipped':
                      raise SystemExit(f'{name} should be skipped when Rust validation is not required: {result}')

          bad = {name: result for name, result in required.items() if result != 'success'}
          if bad:
              raise SystemExit(f'applicable merge gates did not pass: {bad}')
          print('All applicable merge gates passed.')
          PY
