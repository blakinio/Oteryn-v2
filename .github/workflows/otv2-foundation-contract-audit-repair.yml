name: OTV2 foundation contract audit repair

on:
  push:
    branches:
      - docs/foundation-contract-hardening-20260805
    paths:
      - .github/workflows/otv2-foundation-contract-audit-repair.yml

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/foundation-contract-hardening-20260805
          fetch-depth: 0

      - name: Apply audit repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, text):
              (root / path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old!r}')
              write(path, text.replace(old, new, 1))

          def replace_count(path, old, new, expected):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} anchors, found {count}: {old!r}')
              write(path, text.replace(old, new))

          backlog = 'docs/architecture/FOUNDATION_DECISION_BACKLOG.md'
          register = 'docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md'
          programme = 'docs/agents/tasks/active/OTV2-20260805-foundation-preimplementation-contracts.md'
          prompt = 'docs/agents/prompts/OTV2_GLOBAL_ARCHITECTURE_DECISION_COORDINATOR.md'
          task = 'docs/agents/tasks/active/OTV2-20260805-foundation-contract-hardening.md'

          for path in (backlog, register, programme, prompt):
              text = read(path)
              if '`DUR-01` — Identifier Contract' not in text:
                  raise SystemExit(f'{path}: missing DUR-01 label')
              text = text.replace(
                  '`DUR-01` — Identifier Contract',
                  '`DUR-01` — Durable Identifier Representation Contract',
              )
              if '`VSL-02` — Exact Rust Client Migration Contract' not in text:
                  raise SystemExit(f'{path}: missing VSL-02 label')
              text = text.replace(
                  '`VSL-02` — Exact Rust Client Migration Contract',
                  '`VSL-02` — Exact Rust Client Migration and Cutover Contract',
              )
              write(path, text)

          replace_once(
              programme,
              '- [ ] `FND-01` Workspace and Dependency Contract accepted.',
              '- [ ] `FND-01` Workspace, Dependency and Existing-Rust Migration Contract accepted.',
          )
          replace_once(
              programme,
              '- [ ] `DUR-01` accepted before schema and wire identities are frozen.',
              '- [ ] `DUR-01` accepted before durable database identity representations are frozen and before authoritative durable gameplay mutation.',
          )
          replace_once(
              programme,
              '- [ ] `VSL-02` pins source SHA, provenance mechanism and rollback before migration.',
              '- [ ] `VSL-02` pins source SHA, provenance, open-PR disposition, source freeze, cutover, history preservation and rollback before migration.',
          )

          new_contracts = (
              '  - docs/contracts/CROSS_REPOSITORY_CONTRACT_LOCK.json\n'
              '  - docs/contracts/RESOURCE_LIMITS_REGISTRY.json\n'
              '  - docs/contracts/FOUNDATION_ERROR_VOCABULARY.md\n'
              '  - docs/contracts/FOUNDATION_FAILURE_SCENARIOS.md\n'
          )
          replace_once(
              programme,
              '  - docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md\n  - docs/architecture/MULTICHANNEL_SYSTEM_SCOPE_MATRIX.md',
              '  - docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md\n' + new_contracts + '  - docs/architecture/MULTICHANNEL_SYSTEM_SCOPE_MATRIX.md',
          )
          replace_once(
              programme,
              '  - docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md\ncontinuation_prompt:',
              '  - docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md\n' + new_contracts + 'continuation_prompt:',
          )
          replace_once(
              programme,
              'last_progress: ADR-0001 through ADR-0005 are accepted; stable foundation gates, progressive implementation policy and the non-owning programme model are durable continuation sources.',
              'last_progress: ADR-0001 through ADR-0005 are accepted; FND-ID-01, the existing-Rust migration audit, and retained cross-repository/limit/error/failure registries now harden the ordered foundation programme.',
          )
          replace_once(
              backlog,
              '- `VSL-02` must pin source SHA, provenance and rollback before moving client code.',
              '- `VSL-02` must pin source SHA, provenance, open-PR disposition, source freeze, cutover, history preservation and rollback before moving client code.',
          )

          governance_path = root / 'docs/agents/GOVERNANCE_CONTRACT.json'
          governance = json.loads(governance_path.read_text(encoding='utf-8'))
          required_documents = governance['required_documents']
          coordinator = 'docs/agents/prompts/OTV2_GLOBAL_ARCHITECTURE_DECISION_COORDINATOR.md'
          if coordinator not in required_documents:
              required_documents.append(coordinator)
          required_architecture = governance['required_architecture']
          for path in [
              'docs/architecture/FOUNDATION_DECISION_BACKLOG.md',
              'docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md',
              'docs/contracts/CROSS_REPOSITORY_CONTRACT_LOCK.json',
              'docs/contracts/RESOURCE_LIMITS_REGISTRY.json',
              'docs/contracts/FOUNDATION_ERROR_VOCABULARY.md',
              'docs/contracts/FOUNDATION_FAILURE_SCENARIOS.md',
          ]:
              if path not in required_architecture:
                  required_architecture.append(path)
          governance_path.write_text(
              json.dumps(governance, indent=2) + '\n',
              encoding='utf-8',
              newline='\n',
          )

          validator = 'tools/agents/validate_governance.py'
          replace_once(
              validator,
              'LANES_PATH = ROOT / "docs/agents/PROJECT_LANES.json"\nEXPECTED_REPOSITORY = "blakinio/Oteryn-v2"',
              'LANES_PATH = ROOT / "docs/agents/PROJECT_LANES.json"\nCONTRACT_LOCK_PATH = ROOT / "docs/contracts/CROSS_REPOSITORY_CONTRACT_LOCK.json"\nLIMITS_REGISTRY_PATH = ROOT / "docs/contracts/RESOURCE_LIMITS_REGISTRY.json"\nEXPECTED_REPOSITORY = "blakinio/Oteryn-v2"',
          )
          replace_once(
              validator,
              '    contract = load_json(CONTRACT_PATH, errors)\n    lanes = load_json(LANES_PATH, errors)\n',
              '    contract = load_json(CONTRACT_PATH, errors)\n    lanes = load_json(LANES_PATH, errors)\n    contract_lock = load_json(CONTRACT_LOCK_PATH, errors)\n    limits_registry = load_json(LIMITS_REGISTRY_PATH, errors)\n',
          )
          validation_block = '''\n    lock_policy = contract_lock.get("policy", {})\n    if lock_policy.get("canonical_revisions_must_be_merged") is not True:\n        errors.append("cross-repository contract lock must require merged canonical revisions")\n    if lock_policy.get("mutable_pr_heads_are_canonical") is not False:\n        errors.append("cross-repository contract lock must reject mutable PR heads as canonical")\n    locked_required = lock_policy.get("required_fields_when_locked", [])\n    if not isinstance(locked_required, list) or not all(isinstance(value, str) for value in locked_required):\n        errors.append("cross-repository locked required fields must be a string list")\n    lock_entries = contract_lock.get("contracts", [])\n    if not isinstance(lock_entries, list):\n        errors.append("cross-repository contracts must be a list")\n        lock_entries = []\n    for index, entry in enumerate(lock_entries):\n        if not isinstance(entry, dict):\n            errors.append(f"cross-repository contract entry {index} must be an object")\n            continue\n        status = entry.get("status")\n        if status == "PENDING_CANONICAL_MERGE":\n            for field in ("canonical_commit", "schema_revision", "schema_sha256"):\n                if entry.get(field) is not None:\n                    errors.append(f"pending contract entry {index} must leave {field} unset")\n            pending_pr = entry.get("pending_pull_request")\n            if not isinstance(pending_pr, int) or pending_pr <= 0:\n                errors.append(f"pending contract entry {index} must name a positive pull request number")\n            if entry.get("accepted_for_fnd02") is not False:\n                errors.append(f"pending contract entry {index} cannot be accepted for FND-02")\n        elif status == "LOCKED":\n            for field in locked_required:\n                if entry.get(field) in (None, "", []):\n                    errors.append(f"locked contract entry {index} missing {field}")\n            commit = entry.get("canonical_commit")\n            digest = entry.get("schema_sha256")\n            revision = entry.get("schema_revision")\n            if not isinstance(commit, str) or re.fullmatch(r"[0-9a-f]{40}", commit) is None:\n                errors.append(f"locked contract entry {index} has invalid canonical commit")\n            if not isinstance(digest, str) or re.fullmatch(r"[0-9a-f]{64}", digest) is None:\n                errors.append(f"locked contract entry {index} has invalid schema digest")\n            if not isinstance(revision, int) or revision <= 0:\n                errors.append(f"locked contract entry {index} has invalid schema revision")\n        else:\n            errors.append(f"cross-repository contract entry {index} has unsupported status: {status}")\n\n    required_limit_fields = limits_registry.get("required_entry_fields", [])\n    if not isinstance(required_limit_fields, list) or not all(isinstance(value, str) for value in required_limit_fields):\n        errors.append("resource-limit required fields must be a string list")\n        required_limit_fields = []\n    if len(required_limit_fields) != len(set(required_limit_fields)):\n        errors.append("resource-limit required fields must be unique")\n    limit_entries = limits_registry.get("entries", [])\n    if not isinstance(limit_entries, list):\n        errors.append("resource-limit entries must be a list")\n        limit_entries = []\n    seen_limit_ids: set[str] = set()\n    for index, entry in enumerate(limit_entries):\n        if not isinstance(entry, dict):\n            errors.append(f"resource-limit entry {index} must be an object")\n            continue\n        missing = [field for field in required_limit_fields if field not in entry]\n        if missing:\n            errors.append(f"resource-limit entry {index} missing fields: {', '.join(missing)}")\n        limit_id = entry.get("id")\n        if not isinstance(limit_id, str) or not limit_id:\n            errors.append(f"resource-limit entry {index} has invalid id")\n        elif limit_id in seen_limit_ids:\n            errors.append(f"duplicate resource-limit id: {limit_id}")\n        else:\n            seen_limit_ids.add(limit_id)\n        if entry.get("hard_maximum") is None:\n            errors.append(f"resource-limit entry {index} must define an absolute hard maximum")\n\n'''
          replace_once(
              validator,
              '    root_agents = (ROOT / "AGENTS.md").read_text(encoding="utf-8") if (ROOT / "AGENTS.md").is_file() else ""\n',
              validation_block + '    root_agents = (ROOT / "AGENTS.md").read_text(encoding="utf-8") if (ROOT / "AGENTS.md").is_file() else ""\n',
          )

          replace_once(
              task,
              '  - docs/agents/tasks/active/OTV2-20260805-foundation-contract-hardening.md\n  - .github/workflows/otv2-foundation-contract-hardening.yml',
              '  - docs/agents/tasks/active/OTV2-20260805-foundation-contract-hardening.md\n  - docs/agents/GOVERNANCE_CONTRACT.json\n  - tools/agents/validate_governance.py',
          )
          replace_once(task, 'updated_at: 2026-08-05T13:25:00+02:00', 'updated_at: 2026-08-05T13:38:00+02:00')
          replace_once(
              task,
              '- Bounded architecture patch reconciles order, migration evidence and shared machine-readable registries.',
              '- Bounded architecture patch reconciles order, migration evidence and shared machine-readable registries.\n- Audit finding `OTV2-FND-HARDEN-001` repaired stale DUR-01 wire-freeze wording and made the new registries retained governance inputs with semantic validation.',
          )
          replace_once(
              task,
              'last_progress: Architecture hardening patch applied and final-tree governance validation started.',
              'last_progress: Audit repair aligned FND-ID-01/DUR-01 boundaries and added retained semantic validation for contract-lock and resource-limit registries.',
          )
          replace_once(task, 'repair_cycles_for_current_gate: 0', 'repair_cycles_for_current_gate: 1')
          replace_once(
              task,
              'next_action: Inspect the exact PR diff, complete the independent audit and record exact-head CI.',
              'next_action: Re-audit the exact repaired diff, record final validation evidence and prepare PR #15 for protected merge.',
          )
          PY

          python tools/agents/validate_governance.py
          python -m py_compile tools/agents/validate_governance.py
          git diff --check

      - name: Persist repaired document and validator tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs tools
          git commit -m "docs(architecture): repair foundation contract audit findings"
          git push origin HEAD:docs/foundation-contract-hardening-20260805
