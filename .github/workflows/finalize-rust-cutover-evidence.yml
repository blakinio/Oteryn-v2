'''
          Path(
              'docs/agents/tasks/active/OTV2-20260806-rust-client-atomic-cutover.md'
          ).write_text(content, encoding='utf-8')
          Path('.github/workflows/finalize-rust-cutover-evidence.yml').unlink()

      - name: Commit terminal checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agents/tasks/active/OTV2-20260806-rust-client-atomic-cutover.md
          git rm --cached --ignore-unmatch .github/workflows/finalize-rust-cutover-evidence.yml || true
          git add -u .github/workflows
          git commit -m "docs(task): record terminal Rust cutover evidence"
          git push origin HEAD:migrate/rust-client-cutover-c923ad8
