name: Repair Rust client cutover

on:
  push:
    branches:
      - migrate/rust-client-cutover-c923ad8
    paths:
      - '.github/workflows/repair-rust-cutover.yml'

permissions:
  contents: write

concurrency:
  group: repair-rust-cutover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migrate/rust-client-cutover-c923ad8
          fetch-depth: 0

      - name: Synchronize current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply owner-approved repair
        shell: python
        run: |
          from pathlib import Path

          cargo = Path('Cargo.toml')
          cargo_text = cargo.read_text(encoding='utf-8')
          old_license = 'license = "MIT"'
          new_license = 'license = "MPL-2.0"'
          if cargo_text.count(old_license) != 1:
              raise SystemExit('expected exactly one MIT workspace license before correction')
          cargo.write_text(cargo_text.replace(old_license, new_license), encoding='utf-8')

          adapter = Path('crates/input-platform/src/adapter.rs')
          adapter_text = adapter.read_text(encoding='utf-8')
          replacements = {
              '#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub(crate) enum PlatformButtonState':
                  '// Constructed by the Windows-only winit adapter; intentionally dormant in Linux builds.\n'
                  '#[cfg_attr(not(windows), allow(dead_code))]\n'
                  '#[derive(Debug, Clone, Copy, PartialEq, Eq)]\n'
                  'pub(crate) enum PlatformButtonState',
              '#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub(crate) enum PlatformWheelUnit':
                  '#[cfg_attr(not(windows), allow(dead_code))]\n'
                  '#[derive(Debug, Clone, Copy, PartialEq, Eq)]\n'
                  'pub(crate) enum PlatformWheelUnit',
              "pub(crate) enum PlatformEvent<'a> {":
                  '#[cfg_attr(not(windows), allow(dead_code))]\n'
                  "pub(crate) enum PlatformEvent<'a> {",
          }
          for old, new in replacements.items():
              if old not in adapter_text:
                  raise SystemExit(f'adapter insertion point not found: {old}')
              adapter_text = adapter_text.replace(old, new, 1)
          adapter.write_text(adapter_text, encoding='utf-8')

      - name: Remove obsolete migration workflows and commit
        run: |
          git rm -f \
            .github/workflows/cleanup-rust-lock.yml \
            .github/workflows/finalize-rust-composition.yml \
            .github/workflows/finalize-rust-identifiers.yml \
            .github/workflows/finalize-rust-merge-coordinator.yml \
            .github/workflows/finalize-rust-narrowing.yml \
            .github/workflows/patch-rust-evidence-coordinator.yml \
            .github/workflows/patch-rust-terminal-checkpoint.yml \
            .github/workflows/repair-rust-cutover.yml
          git add Cargo.toml crates/input-platform/src/adapter.rs
          git commit -m "fix(rust): align and validate atomic cutover"
          git push origin HEAD:migrate/rust-client-cutover-c923ad8
