name: Bootstrap Rust Clippy fixes

on:
  push:
    branches:
      - migrate/rust-client-cutover-c923ad8
    paths:
      - '.github/workflows/bootstrap-rust-clippy-fix.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-rust-clippy-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migrate/rust-client-cutover-c923ad8

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

      - name: Apply machine-applicable Clippy fixes
        run: cargo +1.94.0 clippy --fix --allow-dirty --allow-staged --locked --workspace --all-targets -- -D warnings

      - name: Format workspace
        run: cargo +1.94.0 fmt --all

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps crates tests tools
          git commit -m "fix(rust): apply strict Clippy repairs"
          git push origin HEAD:migrate/rust-client-cutover-c923ad8
