name: Rust cutover terminal audit

on:
  push:
    branches:
      - migrate/rust-client-cutover-c923ad8
    paths:
      - '.github/workflows/rust-cutover-terminal-audit.yml'

permissions:
  contents: read

concurrency:
  group: rust-cutover-terminal-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: '1.94.0'
  SOURCE_SUBTREE_TREE: c0928dafca6df19ff11d7901e503ed85a5199439

jobs:
  linux:
    name: Terminal / Linux workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt

      - name: Verify formatting metadata and licensing
        run: |
          cargo +$RUST_VERSION fmt --all --check
          cargo +$RUST_VERSION metadata --locked --format-version 1 > metadata.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('Cargo.toml').read_text(encoding='utf-8')
          if 'license = "MPL-2.0"' not in root or 'license = "MIT"' in root:
              raise SystemExit('root workspace license is not MPL-2.0')
          metadata = json.loads(Path('metadata.json').read_text(encoding='utf-8'))
          members = set(metadata['workspace_members'])
          invalid = [
              package['name']
              for package in metadata['packages']
              if package['id'] in members and package.get('license') != 'MPL-2.0'
          ]
          if invalid:
              raise SystemExit(f'workspace packages without MPL-2.0: {invalid}')
          print('workspace metadata and licensing: PASS')
          PY

      - name: Verify architecture and production closure
        run: |
          cargo +$RUST_VERSION run --locked -p oteryn-architecture-check -- workspace .
          cargo +$RUST_VERSION tree --locked -p oteryn-client --edges normal,build > production-tree.txt
          python - <<'PY'
          from pathlib import Path

          tree = Path('production-tree.txt').read_text(encoding='utf-8')
          forbidden = (
              'protocol-canary', 'protocol-core', 'protocol-oteryn', 'transport',
              'game-session', 'oteryn-client-domain', 'oteryn-client-simulation',
              'oteryn-synthetic-assets', 'oteryn-test-support',
              'oteryn-synthetic-client-harness',
          )
          found = [value for value in forbidden if value in tree]
          if found:
              raise SystemExit(f'forbidden production closure entries: {found}')
          print('production closure: PASS')
          PY

      - name: Build lint test and execute synthetic harness
        run: |
          cargo +$RUST_VERSION build --locked --workspace --all-targets
          cargo +$RUST_VERSION clippy --locked --workspace --all-targets -- -D warnings
          cargo +$RUST_VERSION test --locked --workspace
          cargo +$RUST_VERSION run --locked -p oteryn-synthetic-client-harness

  windows:
    name: Terminal / Windows pre-native client
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install $env:RUST_VERSION --profile minimal --component clippy,rustfmt

      - name: Build lint smoke and execute synthetic harness
        shell: pwsh
        run: |
          cargo +$env:RUST_VERSION build --locked --release -p oteryn-client --target x86_64-pc-windows-msvc
          cargo +$env:RUST_VERSION clippy --locked -p oteryn-client --all-targets --target x86_64-pc-windows-msvc -- -D warnings
          cargo +$env:RUST_VERSION run --locked -p oteryn-client --target x86_64-pc-windows-msvc -- --smoke
          cargo +$env:RUST_VERSION run --locked -p oteryn-synthetic-client-harness

  supply-chain:
    name: Terminal / supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check advisories licenses bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # cargo-deny 0.20.2
        with:
          rust-version: '1.94.0'
          command: check
          arguments: --all-features

  migration-audit:
    name: Terminal / adversarial migration audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out complete destination history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - name: Reconcile source subtree and open source pull requests
        shell: python
        run: |
          import json
          import os
          import urllib.request

          headers = {
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'Oteryn-v2-cutover-audit',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          commit = get('https://api.github.com/repos/blakinio/otclient/commits/main')
          root_tree = get(commit['commit']['tree']['url'])
          actual_tree = next(
              (
                  entry['sha']
                  for entry in root_tree['tree']
                  if entry['path'] == 'oteryn-client' and entry['type'] == 'tree'
              ),
              None,
          )
          expected_tree = os.environ['SOURCE_SUBTREE_TREE']
          if actual_tree != expected_tree:
              raise SystemExit(
                  f'source subtree drift: expected {expected_tree}, actual {actual_tree}'
              )

          pulls = get('https://api.github.com/repos/blakinio/otclient/pulls?state=open&per_page=100')
          overlapping = []
          for pull in pulls:
              files = get(pull['url'] + '/files?per_page=100')
              paths = [item['filename'] for item in files]
              if any(path.startswith('oteryn-client/') for path in paths):
                  overlapping.append({'pr': pull['number'], 'paths': paths})
          if overlapping:
              raise SystemExit(f'open source PR changes frozen subtree: {overlapping}')
          print('source subtree and open-PR reconciliation: PASS')

      - name: Verify provenance identifiers assets and workflow isolation
        shell: python
        run: |
          import json
          import re
          import subprocess
          from pathlib import Path

          document = json.loads(
              Path('docs/migration/rust-client-provenance.json').read_text(encoding='utf-8')
          )
          checked = 0
          for record in document['records']:
              if record.get('verification') != 'destination blob SHA equals source blob SHA':
                  continue
              path = record['destination_path']
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              expected = record['source_blob_sha']
              if actual != expected:
                  raise SystemExit(
                      f'provenance mismatch for {path}: expected {expected}, actual {actual}'
                  )
              checked += 1
          if checked < 10:
              raise SystemExit(f'insufficient immutable provenance evidence: {checked}')

          forbidden_identifiers = re.compile(
              r'\b(SessionGeneration|TaskGeneration|WorldId|CharacterId|ChannelId|'
              r'AccountSessionId|DirectoryRevision|GameplayChannelId|GameEntryCredential|'
              r'CanaryCurrent)\b'
          )
          findings = []
          for root in ('apps', 'crates', 'tests', 'tools'):
              for path in Path(root).rglob('*.rs'):
                  match = forbidden_identifiers.search(path.read_text(encoding='utf-8'))
                  if match:
                      findings.append(f'{path}: {match.group(0)}')
          if findings:
              raise SystemExit('forbidden identifier leaks: ' + ', '.join(findings))

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines()
          forbidden_paths = [
              path
              for path in changed
              if path.startswith(('data/things/', 'data/sounds/', 'oteryn-client/'))
              or path.lower().endswith(('.dat', '.spr', '.otb', '.otbm', '.exe', '.dll', '.pdb'))
          ]
          if forbidden_paths:
              raise SystemExit(f'forbidden asset or source paths: {forbidden_paths}')

          workflows = sorted(path.name for path in Path('.github/workflows').glob('*.yml'))
          unexpected = [
              name
              for name in workflows
              if name not in {
                  'agent-governance.yml',
                  'codeql.yml',
                  'dependency-review.yml',
                  'rust.yml',
                  'rust-cutover-terminal-audit.yml',
              }
          ]
          if unexpected:
              raise SystemExit(f'unexpected workflow files: {unexpected}')
          print(f'immutable provenance blobs: PASS ({checked})')
          print('identifier asset and workflow isolation: PASS')

      - name: Re-run exact architecture checker
        run: cargo +$RUST_VERSION run --locked -p oteryn-architecture-check -- workspace .
