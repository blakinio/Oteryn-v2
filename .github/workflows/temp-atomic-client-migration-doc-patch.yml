name: Temporary atomic client migration document patch

on:
  push:
    branches:
      - arch/vsl02-atomic-destination-pr-20260805

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arch/vsl02-atomic-destination-pr-20260805

      - name: Patch canonical architecture registers
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          backlog = "docs/architecture/FOUNDATION_DECISION_BACKLOG.md"
          register = "docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md"
          programme = "docs/agents/tasks/active/OTV2-20260805-foundation-preimplementation-contracts.md"

          replace_exact(
              backlog,
              "   - the destination must not create a competing placeholder client before the accepted migration/cutover.\n",
              "   - the destination must not create a competing placeholder client before the accepted migration/cutover;\n"
              "   - one atomic `blakinio/Oteryn-v2` destination PR must include the accepted client import, root-workspace creation/completion, FND-01 dispositions, dependency enforcement, `protocol-canary` isolation, provenance and exact-head validation;\n"
              "   - a later `blakinio/otclient` PR is source-only cutover closeout that marks the old path moved/non-canonical after the destination merge.\n",
          )

          replace_exact(
              backlog,
              "The destination migration package may create or complete the canonical root workspace around the migrated client, or a separate workspace-bootstrap task may run immediately after migration. Every member still requires an immediate consumer, observable acceptance and the dependency boundaries accepted by `FND-01`.\n\n### Gate 2 — after `VSL-02` migration/cutover\n\nA separately authorized bootstrap/completion task may establish the smallest compilable root workspace and executable architecture checks if the migration package did not already do so.\n\nAllowed:\n\n- root Cargo metadata and toolchain configuration;\n- the migrated client and minimal placeholder-free crates/applications selected by `FND-01`;\n- immediate server/shared consumers required to prove the accepted dependency graph;\n- compile-only interfaces and test fixtures that do not silently freeze an unresolved public contract;\n- dependency-graph checks and forbidden-edge validation;\n- bounded, reversible technical spikes whose results are recorded as evidence.\n",
              "The destination migration package must deliver one atomic `blakinio/Oteryn-v2` PR that imports the accepted client paths, applies every `FND-01` disposition, creates or completes the canonical root workspace, enforces the accepted dependency boundaries, isolates `protocol-canary`, records provenance and validates the complete destination head. No separate import-only or post-import workspace-consolidation destination PR is allowed. Every member still requires an immediate consumer and observable acceptance.\n\nAfter that destination PR is squash-merged and verified, a separate coordinated `blakinio/otclient` source-marker PR marks the old path moved/non-canonical and points to the exact destination merge. It is closeout, not a second destination implementation phase.\n\n### Gate 2 — after the atomic `VSL-02` destination merge and source-marker cutover\n\nThe canonical root workspace already exists around the migrated client. Later packages may extend it only for immediate consumers and within the accepted dependency graph.\n\nAllowed:\n\n- maintenance of the accepted root Cargo metadata, toolchain and lockfile;\n- addition of minimal placeholder-free crates/applications required by an authorized immediate consumer;\n- compile-only interfaces and test fixtures that do not silently freeze an unresolved public contract;\n- dependency-graph checks and forbidden-edge validation;\n- bounded, reversible technical spikes whose results are recorded as evidence.\n",
          )

          replace_exact(
              backlog,
              "- history and provenance preservation mechanism;\n- exact source-to-destination path mapping and exclusions;\n- migration disposition for every crate/subsystem using the `FND-01` classification;\n- whether root workspace creation occurs inside the migration package or immediately afterward;\n- destination build/test matrix and source/destination equivalence evidence;\n",
              "- provenance/history traceability compatible with mandatory squash merge: immutable source retention, exact SHA/range, machine-readable path/provenance mapping, copyright/license records and source links without false ancestry claims;\n- exact source-to-destination path mapping and exclusions;\n- migration disposition for every crate/subsystem using the `FND-01` classification;\n- one atomic destination PR containing the accepted import, root-workspace creation/completion, dependency enforcement, `protocol-canary` isolation and complete validation;\n- destination build/test matrix and source/destination equivalence evidence;\n",
          )

          replace_exact(
              backlog,
              "The migration programme requires one separately authorized task, branch and PR per written repository under one coordination ID. Do not freeze shared client/server contracts until the destination contains the accepted canonical client source.\n",
              "The migration programme requires one atomic destination task/branch/PR in `blakinio/Oteryn-v2`. A later separate task/branch/PR in `blakinio/otclient` may only freeze and mark the source moved/non-canonical after the verified destination merge. Both use one coordination ID and explicit rollout/rollback order. Do not freeze shared client/server contracts until both the destination is canonical and the source cutover marker is terminal.\n",
          )

          replace_exact(
              backlog,
              "```text\n1. Accept FND-01 Workspace, Dependency and Existing-Rust Migration Contract\n2. Accept VSL-02 Exact Rust Client Migration and Cutover Contract\n3. Execute the coordinated client migration/cutover and source freeze programme\n4. Create or complete the minimal canonical root workspace around the migrated client\n5. Accept FND-ID-01 Foundation Identifier Vocabulary, including event/operation/transaction identities\n6. Merge and lock the final canonical Platform native-contract correction\n7. Accept FND-02 protocol-oteryn v1 Contract\n8. Accept FND-03 Runtime Execution Contract, including clock and event-emission semantics\n9. Accept FND-04 Identity, Game Session, Admission and Character Lease Contract\n10. Accept DUR-01 full Identifier Contract for database and durable-state representation\n11. Accept ANL-01 Game Event and Audit Foundation Contract\n12. Accept DUR-02 Persistence v1 Contract with transactional outbox/audit recovery\n13. Accept DUR-03 Item Transaction and Anti-Duplication Contract, if not complete in DUR-02\n14. Draft ANL-02 and ANL-03 on the accepted event/persistence/item foundations\n15. Run the bounded world-format spike and complete DUR-04 under ADR-0005\n16. Accept VSL-01 Foundation Vertical-Slice Programme with correlated event/audit evidence\n17. Execute the separately authorized vertical-slice implementation programme\n18. Complete ANL-02/ANL-03 before production-grade alpha analytics claims; defer ANL-04 until read-only investigation is authorized\n```",
              "```text\n1. Accept FND-01 Workspace, Dependency and Existing-Rust Migration Contract\n2. Accept VSL-02 Exact Rust Client Migration and Cutover Contract\n3. Freeze and reconcile the exact source SHA, open PRs, tasks and post-inventory changes\n4. Deliver one atomic Oteryn-v2 destination PR containing client migration, root-workspace creation/completion, dependency enforcement, protocol-canary isolation, provenance and validation\n5. Squash-merge and verify the exact destination result\n6. Merge the source-only otclient moved/non-canonical marker PR\n7. Accept FND-ID-01 Foundation Identifier Vocabulary, including event/operation/transaction identities\n8. Merge and lock the final canonical Platform native-contract correction\n9. Accept FND-02 protocol-oteryn v1 Contract\n10. Accept FND-03 Runtime Execution Contract, including clock and event-emission semantics\n11. Accept FND-04 Identity, Game Session, Admission and Character Lease Contract\n12. Accept DUR-01 full Identifier Contract for database and durable-state representation\n13. Accept ANL-01 Game Event and Audit Foundation Contract\n14. Accept DUR-02 Persistence v1 Contract with transactional outbox/audit recovery\n15. Accept DUR-03 Item Transaction and Anti-Duplication Contract, if not complete in DUR-02\n16. Draft ANL-02 and ANL-03 on the accepted event/persistence/item foundations\n17. Run the bounded world-format spike and complete DUR-04 under ADR-0005\n18. Accept VSL-01 Foundation Vertical-Slice Programme with correlated event/audit evidence\n19. Execute the separately authorized vertical-slice implementation programme\n20. Complete ANL-02/ANL-03 before production-grade alpha analytics claims; defer ANL-04 until read-only investigation is authorized\n```",
          )

          replace_exact(
              backlog,
              "- A canonical destination workspace may be created or completed only by the coordinated migration package or a separate task immediately after migration; no competing placeholder client is allowed.\n",
              "- The canonical destination workspace must be created or completed inside the one atomic Oteryn-v2 migration PR; no import-only destination PR, later workspace-consolidation destination PR or competing placeholder client is allowed.\n- The separate otclient source-marker PR may merge only after the destination squash merge is immutable and verified; it carries no destination implementation.\n- Squash-merge provenance must retain exact source SHA/range and machine-readable path mapping without claiming imported Git ancestry.\n",
          )

          replace_exact(
              register,
              "| Canonical repository, Rust client migration direction and early cutover sequencing | `ACCEPTED` | ADR-0002 |\n",
              "| Canonical repository, early Rust client cutover and one atomic destination migration PR | `ACCEPTED` | ADR-0002 |\n",
          )

          replace_exact(
              register,
              "- The coordinated migration package may create or complete the destination workspace around the migrated client, or a separate bootstrap task may run immediately after migration.\n",
              "- One atomic `blakinio/Oteryn-v2` destination PR must contain the accepted client migration, root-workspace creation/completion, dependency enforcement, `protocol-canary` isolation, provenance and exact-head validation; no separate destination bootstrap PR may follow.\n- A later `blakinio/otclient` PR is source-only cutover closeout and may merge only after the verified destination squash merge.\n",
          )

          replace_exact(
              register,
              "- Define history/provenance preservation, path mapping, exclusions, migration dispositions, source-repository freeze, destination ownership, cutover and rollback.\n- Decide whether the canonical root workspace is created/completed inside the migration package or immediately afterward.\n- Prove the migrated client builds/tests on the exact destination head before marking the source non-canonical.\n",
              "- Define provenance/history traceability compatible with squash merge, path mapping, exclusions, migration dispositions, source-repository freeze, destination ownership, cutover and rollback.\n- Require one atomic destination PR containing the accepted import, canonical root-workspace creation/completion, dependency enforcement, `protocol-canary` isolation and complete validation.\n- Prove the migrated client and complete workspace build/test matrix on the exact destination head before the later source-marker PR marks the source non-canonical.\n",
          )

          replace_exact(
              register,
              "- Use one task/branch/PR per written repository under one coordination ID and explicit rollout order.\n",
              "- Use one atomic destination task/branch/PR in Oteryn-v2 and one later source-marker task/branch/PR in otclient under one coordination ID and explicit rollout/rollback order.\n- Preserve exact source SHA/range and machine-readable provenance/path mapping; do not claim source commits became destination mainline ancestry through squash merge.\n",
          )

          replace_exact(
              register,
              "11. FND-01 must terminate into VSL-02; no isolated workspace bootstrap may bypass the accepted client cutover sequence.\n",
              "11. FND-01 must terminate into VSL-02; no isolated workspace bootstrap may bypass the accepted client cutover sequence.\n12. VSL-02 uses one atomic Oteryn-v2 destination PR; the later otclient PR is source-marker closeout only.\n",
          )

          replace_exact(
              register,
              "Draft and accept `FND-01` — the **Workspace, Dependency and Existing-Rust Migration Contract**. Its terminal next action is `VSL-02`, followed by the coordinated client migration/cutover and only then destination workspace bootstrap/completion and layer-specific contracts.\n",
              "Draft and accept `FND-01` — the **Workspace, Dependency and Existing-Rust Migration Contract**. Its terminal next action is `VSL-02`, followed by one atomic destination migration/workspace PR, the source-only cutover marker and only then layer-specific contracts.\n",
          )

          replace_exact(
              programme,
              "   - the destination must not create a competing placeholder client before cutover.\n",
              "   - the destination must not create a competing placeholder client before cutover;\n"
              "   - one atomic Oteryn-v2 destination PR contains the client import, root-workspace creation/completion, FND-01 dispositions, dependency enforcement, protocol-canary isolation, provenance and exact-head validation;\n"
              "   - the later otclient PR only marks the old path moved/non-canonical after the destination merge.\n",
          )

          replace_exact(
              programme,
              "The coordinated migration package may create or complete the root workspace around the migrated client. Otherwise a separate minimal workspace-bootstrap/completion task runs immediately after migration.\n\nThe wider candidate crate list is a capability horizon, not an initial checklist. Empty placeholder crates and speculative abstractions are prohibited.\n\n### After `VSL-02` migration/cutover\n\nA separately authorized workspace-bootstrap/completion task may create the smallest immediately consumed members, toolchain/CI metadata and executable dependency-boundary checks when those were not already delivered by the migration package.\n\nThis bootstrap does not authorize canonical protocol, authoritative runtime, production admission/lease, durable gameplay or broad content import.\n",
              "The coordinated migration package must deliver one atomic Oteryn-v2 destination PR containing the accepted client import, root-workspace creation/completion, dependency-boundary enforcement, protocol-canary isolation, provenance and exact-head validation. A separate import-only or post-import workspace-consolidation destination PR is prohibited.\n\nThe wider candidate crate list is a capability horizon, not an initial checklist. Empty placeholder crates and speculative abstractions are prohibited.\n\nAfter the destination squash merge is verified, a separate otclient source-marker PR marks the old path moved/non-canonical. It is cross-repository closeout and contains no destination implementation.\n\n### After the atomic `VSL-02` destination merge and source-marker cutover\n\nThe canonical root workspace already exists around the migrated client. Later authorized packages may extend it only for immediate consumers and may not claim unresolved protocol, runtime, admission, durable gameplay or broad content capabilities.\n",
          )

          replace_exact(
              programme,
              "- provenance/history preservation and exact source-to-destination path mapping;\n- per-crate/subsystem migration disposition from FND-01;\n- destination workspace creation/completion sequence;\n- exact source/destination build and test evidence;\n",
              "- squash-compatible provenance/history traceability through immutable source retention, exact SHA/range, machine-readable path mapping, copyright/license records and source links;\n- per-crate/subsystem migration disposition from FND-01;\n- one atomic destination PR containing migration, root-workspace creation/completion, dependency enforcement, protocol-canary isolation and validation;\n- exact source/destination build and test evidence;\n",
          )

          replace_exact(
              programme,
              "- one task/branch/PR per written repository under one rollout order;\n",
              "- one atomic destination task/branch/PR in Oteryn-v2 plus one later source-marker task/branch/PR in otclient under one rollout/rollback order;\n",
          )

          replace_exact(
              programme,
              "- [ ] The root workspace is created/completed around the migrated client by the migration package or an immediate post-migration bootstrap task.\n",
              "- [ ] One atomic Oteryn-v2 destination PR creates/completes the root workspace around the migrated client; no second destination bootstrap/consolidation PR exists.\n- [ ] The later otclient PR only marks the source moved/non-canonical after the destination squash merge is verified.\n- [ ] Provenance records exact source SHA/range and path mapping without a false Git-ancestry claim.\n",
          )

          replace_exact(
              programme,
              "- ADR-0002 resolved canonical repository ownership and now requires early client migration/cutover immediately after FND-01.\n",
              "- ADR-0002 resolved canonical repository ownership, requires early client migration/cutover immediately after FND-01 and fixes one atomic destination migration/workspace PR followed by a source-only marker PR.\n",
          )

          replace_exact(
              programme,
              "last_progress: ADR-0001 through ADR-0006 are accepted; ADR-0002 now requires VSL-02 and controlled client migration/cutover immediately after FND-01, before shared client/server contracts are frozen.\n",
              "last_progress: ADR-0001 through ADR-0006 are accepted; ADR-0002 requires VSL-02 immediately after FND-01 and one atomic destination migration/workspace PR before a source-only cutover marker and shared-contract freeze.\n",
          )

          replace_exact(
              programme,
              "validation_state: Each package requires exact-head Agent governance and full-diff audit; dependency boundaries become executable checks after client migration and destination workspace bootstrap/completion.\n",
              "validation_state: Each package requires exact-head Agent governance and full-diff audit; dependency boundaries become executable checks inside the atomic destination migration/workspace PR.\n",
          )

          replace_exact(
              programme,
              "next_action: Execute the global architecture coordinator prompt and draft, audit, accept, merge and archive FND-01 — the Workspace, Dependency and Existing-Rust Migration Contract; its terminal next action must be VSL-02.\n",
              "next_action: Execute the global architecture coordinator prompt and draft, audit, accept, merge and archive FND-01 — the Workspace, Dependency and Existing-Rust Migration Contract; its terminal next action must be VSL-02 and the atomic destination migration/workspace contract.\n",
          )

      - name: Check patch
        run: git diff --check && git diff --stat

      - name: Commit patched documents
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/FOUNDATION_DECISION_BACKLOG.md \
                  docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md \
                  docs/agents/tasks/active/OTV2-20260805-foundation-preimplementation-contracts.md
          git commit -m "docs(architecture): synchronize atomic migration delivery"
          git push origin HEAD:arch/vsl02-atomic-destination-pr-20260805
