name: Finalize Rust cutover merge

on:
  push:
    branches:
      - migrate/rust-client-cutover-c923ad8
    paths:
      - 'docs/agents/tasks/active/OTV2-20260806-rust-client-atomic-cutover.md'
      - '.github/workflows/finalize-rust-merge-coordinator.yml'

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: finalize-rust-cutover-merge
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  REPOSITORY: blakinio/Oteryn-v2
  FEATURE_PR: '50'
  TASK_PATH: docs/agents/tasks/active/OTV2-20260806-rust-client-atomic-cutover.md
  ARCHIVE_PATH: docs/agents/tasks/archive/OTV2-20260806-rust-client-atomic-cutover.md

jobs:
  merge-and-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migrate/rust-client-cutover-c923ad8
          fetch-depth: 0

      - name: Resolve checkpoint readiness
        id: readiness
        shell: python
        run: |
          from pathlib import Path
          task = Path('docs/agents/tasks/active/OTV2-20260806-rust-client-atomic-cutover.md')
          text = task.read_text(encoding='utf-8')
          ready = (
              'status: ready' in text
              and 'terminal_evidence_run:' in text
              and 'open material findings: `0`' in text
              and 'source_repository_writes: 0' in text
          )
          with Path(__import__('os').environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write(f'ready={str(ready).lower()}\n')
          print(f'terminal checkpoint ready: {ready}')

      - name: Stop until terminal evidence exists
        if: steps.readiness.outputs.ready != 'true'
        run: echo 'Terminal evidence checkpoint has not been committed yet.'

      - name: Remove merge coordinator from final head
        if: steps.readiness.outputs.ready == 'true'
        id: final-head
        run: |
          git rm .github/workflows/finalize-rust-merge-coordinator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(rust): remove terminal merge coordinator"
          git push origin HEAD:migrate/rust-client-cutover-c923ad8
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for retained final-head checks
        if: steps.readiness.outputs.ready == 'true'
        env:
          FINAL_HEAD: ${{ steps.final-head.outputs.sha }}
        shell: python
        run: |
          import json
          import os
          import time
          import urllib.request

          required = {'Agent governance', 'Dependency review', 'CodeQL'}
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'Oteryn-v2-terminal-merge',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          deadline = time.monotonic() + 40 * 60
          while time.monotonic() < deadline:
              data = get(
                  'https://api.github.com/repos/blakinio/Oteryn-v2/actions/runs'
                  f'?head_sha={os.environ["FINAL_HEAD"]}&per_page=100'
              )
              newest = {}
              for run in sorted(data['workflow_runs'], key=lambda item: item['id'], reverse=True):
                  newest.setdefault(run['name'], run)
              failures = {
                  name: newest[name].get('conclusion')
                  for name in required
                  if name in newest
                  and newest[name]['status'] == 'completed'
                  and newest[name].get('conclusion') != 'success'
              }
              if failures:
                  raise SystemExit(f'final-head required check failure: {failures}')
              if all(
                  name in newest
                  and newest[name]['status'] == 'completed'
                  and newest[name].get('conclusion') == 'success'
                  for name in required
              ):
                  print(
                      'final retained checks: '
                      + ', '.join(f'{name}={newest[name]["id"]}' for name in sorted(required))
                  )
                  break
              time.sleep(20)
          else:
              raise SystemExit('final-head required checks did not complete within bounded wait')

      - name: Verify PR head reviews and mergeability
        if: steps.readiness.outputs.ready == 'true'
        env:
          FINAL_HEAD: ${{ steps.final-head.outputs.sha }}
        shell: bash
        run: |
          actual_head=$(gh pr view "$FEATURE_PR" --repo "$REPOSITORY" --json headRefOid --jq .headRefOid)
          test "$actual_head" = "$FINAL_HEAD"
          unresolved=$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' \
            -f owner=blakinio -f name=Oteryn-v2 -F number=50 \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
          test "$unresolved" = "0"
          changes_requested=$(gh api "repos/$REPOSITORY/pulls/$FEATURE_PR/reviews?per_page=100" \
            --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | length')
          test "$changes_requested" = "0"

      - name: Mark ready and exact-head squash merge
        if: steps.readiness.outputs.ready == 'true'
        id: feature-merge
        env:
          FINAL_HEAD: ${{ steps.final-head.outputs.sha }}
        shell: bash
        run: |
          gh pr ready "$FEATURE_PR" --repo "$REPOSITORY"
          result=$(gh api -X PUT "repos/$REPOSITORY/pulls/$FEATURE_PR/merge" \
            -f merge_method=squash \
            -f sha="$FINAL_HEAD" \
            -f commit_title='feat(rust): perform atomic client cutover (#50)' \
            -f commit_message='Create the accepted 19-member Rust workspace, preserve reviewed client capabilities, enforce production/synthetic closure separation, and deliver the explicit pre-native product state.')
          merged=$(printf '%s' "$result" | jq -r .merged)
          test "$merged" = "true"
          merge_sha=$(printf '%s' "$result" | jq -r .sha)
          echo "sha=$merge_sha" >> "$GITHUB_OUTPUT"

      - name: Create archive branch and lifecycle PR
        if: steps.readiness.outputs.ready == 'true'
        id: archive-pr
        env:
          FEATURE_MERGE: ${{ steps.feature-merge.outputs.sha }}
        shell: bash
        run: |
          git fetch origin main
          git checkout -B docs/archive-rust-client-atomic-cutover origin/main
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          source = Path(os.environ['TASK_PATH'])
          destination = Path(os.environ['ARCHIVE_PATH'])
          text = source.read_text(encoding='utf-8')
          text = text.replace('status: ready', 'status: completed', 1)
          text = text.replace(
              'owner: GPT-5.6-Thinking-migration-coordinator',
              'owner: released',
              1,
          )
          marker = 'source_repository_writes: 0\n'
          insertion = (
              marker
              + f'merge_commit: {os.environ["FEATURE_MERGE"]}\n'
              + 'completed_at: '
              + datetime.now(timezone.utc).isoformat()
              + '\n'
          )
          text = text.replace(marker, insertion, 1)
          text = text.replace(
              'status: ready\nbranch: migrate/rust-client-cutover-c923ad8',
              'status: completed\nbranch: main',
          )
          text = text.replace(
              'blocker: retained exact-head governance checks after checkpoint commit',
              'blocker: null',
          )
          text = text.replace(
              'next_action: verify final Agent governance Dependency Review and CodeQL then mark PR ready and protected squash-merge',
              'next_action: continue the ordered foundation programme; any source marker requires a separately authorized blakinio/otclient task',
          )
          text += f'''\n\n## Closeout\n\n```yaml\nfeature_pr: 50\nmerge_method: squash\nmerge_commit: {os.environ["FEATURE_MERGE"]}\nownership_released: true\nsource_repository_writes: 0\nsource_marker_performed: false\n```\n'''
          destination.write_text(text, encoding='utf-8')
          source.unlink()
          PY
          git add "$ARCHIVE_PATH"
          git rm "$TASK_PATH"
          git commit -m "docs(agents): archive atomic Rust client cutover"
          git push -u origin docs/archive-rust-client-atomic-cutover
          archive_url=$(gh pr create --repo "$REPOSITORY" \
            --base main \
            --head docs/archive-rust-client-atomic-cutover \
            --title 'docs(agents): archive atomic Rust client cutover' \
            --body $'## Summary\n\nArchive the completed atomic Rust-client cutover after PR #50 and release active ownership.\n\n## Scope\n\n- move the completed task record from active to archive;\n- record the exact feature merge and source-marker boundary;\n- make no architecture, Cargo, runtime, protocol or external-repository change.\n\n## Validation\n\n- lifecycle-only two-file diff;\n- exact-head Agent governance, Dependency Review and CodeQL required;\n- component/integration/E2E are NOT_APPLICABLE because this PR only archives completed task state.')
          archive_number=${archive_url##*/}
          echo "number=$archive_number" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for archive exact-head checks
        if: steps.readiness.outputs.ready == 'true'
        env:
          ARCHIVE_HEAD: ${{ steps.archive-pr.outputs.sha }}
        shell: python
        run: |
          import json
          import os
          import time
          import urllib.request

          required = {'Agent governance', 'Dependency review', 'CodeQL'}
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'User-Agent': 'Oteryn-v2-archive-merge',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          deadline = time.monotonic() + 15 * 60
          while time.monotonic() < deadline:
              request = urllib.request.Request(
                  'https://api.github.com/repos/blakinio/Oteryn-v2/actions/runs'
                  f'?head_sha={os.environ["ARCHIVE_HEAD"]}&per_page=100',
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
              newest = {}
              for run in sorted(data['workflow_runs'], key=lambda item: item['id'], reverse=True):
                  newest.setdefault(run['name'], run)
              failures = {
                  name: newest[name].get('conclusion')
                  for name in required
                  if name in newest
                  and newest[name]['status'] == 'completed'
                  and newest[name].get('conclusion') != 'success'
              }
              if failures:
                  raise SystemExit(f'archive required check failure: {failures}')
              if all(
                  name in newest
                  and newest[name]['status'] == 'completed'
                  and newest[name].get('conclusion') == 'success'
                  for name in required
              ):
                  break
              time.sleep(20)
          else:
              raise SystemExit('archive checks did not complete within bounded wait')

      - name: Exact-head merge archive PR
        if: steps.readiness.outputs.ready == 'true'
        env:
          ARCHIVE_PR: ${{ steps.archive-pr.outputs.number }}
          ARCHIVE_HEAD: ${{ steps.archive-pr.outputs.sha }}
        shell: bash
        run: |
          unresolved=$(gh api graphql \
            -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' \
            -f owner=blakinio -f name=Oteryn-v2 -F number="$ARCHIVE_PR" \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
          test "$unresolved" = "0"
          result=$(gh api -X PUT "repos/$REPOSITORY/pulls/$ARCHIVE_PR/merge" \
            -f merge_method=squash \
            -f sha="$ARCHIVE_HEAD" \
            -f commit_title="docs(agents): archive atomic Rust client cutover (#$ARCHIVE_PR)" \
            -f commit_message='Archive the completed migration checkpoint and release active ownership.')
          test "$(printf '%s' "$result" | jq -r .merged)" = "true"
