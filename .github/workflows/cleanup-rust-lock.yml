name: Finalize corrected Rust lockfile

on:
  push:
    branches:
      - migrate/rust-client-cutover-c923ad8
    paths:
      - '.github/workflows/cleanup-rust-lock.yml'

permissions:
  contents: write

concurrency:
  group: finalize-rust-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migrate/rust-client-cutover-c923ad8

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Regenerate exact lockfile
        run: cargo +1.94.0 generate-lockfile

      - name: Remove one-shot workflows and commit
        run: |
          git rm -f .github/workflows/bootstrap-rust-lock.yml .github/workflows/cleanup-rust-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build(rust): finalize narrowed workspace lockfile"
          git push origin HEAD:migrate/rust-client-cutover-c923ad8
