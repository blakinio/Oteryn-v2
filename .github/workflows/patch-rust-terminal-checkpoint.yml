name: Complete terminal Rust checkpoint

on:
  push:
    branches:
      - migrate/rust-client-cutover-c923ad8
    paths:
      - '.github/workflows/patch-rust-terminal-checkpoint.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migrate/rust-client-cutover-c923ad8

      - name: Complete task ownership and dependency declaration
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/finalize-rust-cutover-evidence.yml')
          text = path.read_text(encoding='utf-8')
          old = '''source_repository_writes: 0
production_operations: 0
```'''
          new = '''source_repository_writes: 0
production_operations: 0
risk: high
base_sha: 33dc15dab82cfe5347e569036296204763270508
execution_budget_minutes: 120
owned_paths:
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - rustfmt.toml
  - deny.toml
  - workspace-boundaries.toml
  - apps/client/**
  - crates/**
  - tests/**
  - tools/**
  - .github/workflows/rust.yml
  - docs/migration/rust-client-provenance.json
  - docs/migration/rust-dependency-delta.json
  - docs/migration/rust-client-transformation-evidence.md
  - docs/agents/tasks/active/OTV2-20260806-rust-client-atomic-cutover.md
public_contracts:
  - workspace-boundaries.toml
  - docs/migration/rust-client-provenance.json
  - docs/migration/rust-dependency-delta.json
  - docs/migration/rust-client-transformation-evidence.md
depends_on:
  - FND-01 accepted workspace contract
  - VSL-02 merged cutover contract
  - ADR-0002 canonical repository
  - ADR-0008 Canary reference-only
  - ADR-0011 pre-native product state
blocks:
  - FND-ID-01
  - FND-02
  - FND-04
external_repositories:
  - blakinio/otclient read-only source evidence; no write authorized
```'''
          if old not in text:
              raise SystemExit('task metadata insertion point not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Remove patch workflow and commit
        run: |
          git rm .github/workflows/patch-rust-terminal-checkpoint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/finalize-rust-cutover-evidence.yml
          git commit -m "ci(rust): complete terminal checkpoint contract"
          git push origin HEAD:migrate/rust-client-cutover-c923ad8
