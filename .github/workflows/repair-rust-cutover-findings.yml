name: Repair Rust cutover audit findings

on:
  push:
    branches:
      - migrate/rust-client-cutover-c923ad8
    paths:
      - '.github/workflows/repair-rust-cutover-findings.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: migrate/rust-client-cutover-c923ad8

      - name: Apply bounded audit repairs
        shell: python
        run: |
          import json
          from pathlib import Path

          deny = Path('deny.toml')
          deny_text = deny.read_text(encoding='utf-8')
          marker = '    "MIT",\n'
          if marker not in deny_text or '    "MPL-2.0",\n' in deny_text:
              raise SystemExit('unexpected cargo-deny license allowlist state')
          deny.write_text(
              deny_text.replace(marker, marker + '    "MPL-2.0",\n', 1),
              encoding='utf-8',
          )

          foundation = Path('crates/foundation/src/lib.rs')
          foundation_text = foundation.read_text(encoding='utf-8')
          old_cancel = '        let _result = self.sender.send(true);\n'
          new_cancel = '        self.sender.send_replace(true);\n'
          if foundation_text.count(old_cancel) != 1:
              raise SystemExit('unexpected CancellationToken implementation')
          foundation.write_text(
              foundation_text.replace(old_cancel, new_cancel, 1),
              encoding='utf-8',
          )

          provenance = Path('docs/migration/rust-client-provenance.json')
          document = json.loads(provenance.read_text(encoding='utf-8'))
          matches = [
              record
              for record in document['records']
              if record.get('destination_path') == 'crates/input-platform/src/adapter.rs'
          ]
          if len(matches) != 1:
              raise SystemExit('expected exactly one input adapter provenance record')
          record = matches[0]
          if record.get('source_blob_sha') != '671de3122ef00c00dd75f784214723e3ea43fc91':
              raise SystemExit('unexpected input adapter source blob')
          record['transformation'] = (
              'source event normalization retained; added non-Windows dead-code scope '
              'annotations required by strict cross-target lint'
          )
          record['verification'] = (
              'source behavior retained; Linux strict Clippy and Windows adapter tests; '
              'byte equality intentionally not claimed'
          )
          provenance.write_text(
              json.dumps(document, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

      - name: Commit repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deny.toml crates/foundation/src/lib.rs docs/migration/rust-client-provenance.json
          git commit -m "fix(rust): resolve terminal audit findings"
          git push origin HEAD:migrate/rust-client-cutover-c923ad8
