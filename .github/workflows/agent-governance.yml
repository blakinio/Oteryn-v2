name: Agent governance

run-name: >-
  Agent governance • ${{ github.event_name }} •
  ${{ github.event.pull_request.number || inputs.pull_request_number || github.ref_name }}

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request number to validate
        required: true
        type: string
      expected_head_sha:
        description: Exact 40-character pull request head SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-governance-${{ github.event.pull_request.number || inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Agent governance / validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: >-
        ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha
        || github.event_name == 'workflow_dispatch' && inputs.expected_head_sha
        || github.sha }}
    steps:
      - name: Verify pull request target and metadata
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_PR_BODY: ${{ github.event.pull_request.body }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          DISPATCH_PR_NUMBER: ${{ inputs.pull_request_number }}
          DISPATCH_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          event_name = os.environ["EVENT_NAME"]
          repository = os.environ["REPOSITORY"]
          errors: list[str] = []

          if event_name == "workflow_dispatch":
              number_text = os.environ.get("DISPATCH_PR_NUMBER", "").strip()
              expected_head = os.environ.get("DISPATCH_EXPECTED_HEAD_SHA", "").strip().lower()
              event_sha = os.environ.get("EVENT_SHA", "").strip().lower()

              if re.fullmatch(r"[1-9][0-9]*", number_text) is None:
                  errors.append("pull_request_number must be a positive integer")
              if re.fullmatch(r"[0-9a-f]{40}", expected_head) is None:
                  errors.append("expected_head_sha must be a full lowercase 40-character SHA")
              if expected_head != event_sha:
                  errors.append(
                      "workflow dispatch ref does not resolve to expected_head_sha; "
                      "select the exact PR head branch before running"
                  )

              if errors:
                  for error in errors:
                      print(f"- {error}", file=sys.stderr)
                  raise SystemExit(1)

              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/pulls/{number_text}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      pull = json.load(response)
              except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
                  print(f"unable to read pull request metadata: {exc}", file=sys.stderr)
                  raise SystemExit(1) from exc

              title = pull.get("title", "")
              body = pull.get("body") or ""
              head_sha = pull.get("head", {}).get("sha", "")
              head_repository = pull.get("head", {}).get("repo", {}).get("full_name", "")
              base_ref = pull.get("base", {}).get("ref", "")
              state = pull.get("state", "")

              if state != "open":
                  errors.append("manual dispatch requires an open pull request")
              if head_sha != expected_head:
                  errors.append("pull request head moved after expected_head_sha was recorded")
          else:
              title = os.environ.get("EVENT_PR_TITLE", "")
              body = os.environ.get("EVENT_PR_BODY", "")
              head_sha = os.environ.get("EVENT_PR_HEAD_SHA", "")
              head_repository = os.environ.get("EVENT_PR_HEAD_REPOSITORY", "")
              base_ref = os.environ.get("EVENT_PR_BASE_REF", "")

          if head_repository != repository:
              errors.append("governance validation only accepts same-repository pull request heads")
          if base_ref != "main":
              errors.append("governance validation only accepts pull requests targeting main")
          if re.fullmatch(r"[0-9a-f]{40}", head_sha) is None:
              errors.append("pull request head SHA is invalid")

          pattern = re.compile(
              r"^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)"
              r"(\([a-z0-9][a-z0-9._/-]*\))?!?: [A-Za-z0-9].+$"
          )
          if len(title) > 72:
              errors.append("PR title must be at most 72 characters")
          if not pattern.fullmatch(title):
              errors.append("PR title must follow type(scope): imperative summary")
          for heading in ("## Summary", "## Scope", "## Validation"):
              if heading not in body:
                  errors.append(f"PR body is missing {heading}")

          if errors:
              for error in errors:
                  print(f"- {error}", file=sys.stderr)
              raise SystemExit(1)

          print(f"Validated PR metadata and exact target head {head_sha}.")
          PY

      - name: Check out exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Verify checked-out SHA
        env:
          EXPECTED_SHA: ${{ env.TARGET_SHA }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "Validated exact checkout: $actual_sha"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate agent governance
        run: python tools/agents/validate_governance.py

      - name: Validate repository policy
        run: python tools/repository/validate_repository_policy.py
